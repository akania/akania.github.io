Screens.shop = (params = {}) => {
  const el = document.createElement('section');
  el.className = 'screen scroll shop';
  el.setAttribute('aria-label', 'Shop');
  let tab = params.tab === 'powers' ? 'powers' : 'themes';
  let busy = false;

  function themeCard(t) {
    const owned = Profile.ownsTheme(t.id);
    const active = Profile.state.themes.active === t.id;
    let action;
    if (active) action = '<button class="btn btn-good" aria-disabled="true" data-noop="1">✓ Equipped</button>';
    else if (owned) action = `<button class="btn btn-alt" data-equip="${t.id}">Equip</button>`;
    else if (Profile.canAfford(t.cost)) action = `<button class="btn" data-buy-theme="${t.id}">Buy</button>`;
    else action = `<button class="btn" data-buy-theme="${t.id}" aria-disabled="true">Need ${t.cost - Profile.points} more ⭐</button>`;
    return `<article class="item panel">
      <div class="preview" data-theme="${t.id}" aria-hidden="true"><span class="pv-eq">7×8=56</span><span class="key">5</span><span class="key key-ok">✓</span><span class="key key-del">⌫</span><span class="key">9</span></div>
      <div>
        <h3 class="display">${t.icon} ${Util.esc(t.name)}</h3>
        <p>${Util.esc(t.blurb)}</p>
        <div class="item-row"><span class="price">${owned ? '<span class="owned">Owned</span>' : (t.cost ? `⭐ ${t.cost}` : 'Free')}</span>${action}</div>
      </div>
    </article>`;
  }

  function powerCard(p) {
    const afford = Profile.canAfford(p.cost);
    return `<article class="item panel">
      <div class="pu-icon" aria-hidden="true">${p.icon}</div>
      <div>
        <h3 class="display">${Util.esc(p.name)}</h3>
        <p>${Util.esc(p.blurb)}</p>
        <div class="rule">${Util.esc(p.rule)}</div>
        <div class="item-row"><span class="price">⭐ ${p.cost}</span><span class="owned">You have: <b>${Profile.count(p.id)}</b></span>
          <button class="btn" data-buy-power="${p.id}"${afford ? '' : ' aria-disabled="true"'}>${afford ? 'Buy' : `Need ${p.cost - Profile.points} more ⭐`}</button></div>
      </div>
    </article>`;
  }

  function render() {
    const scroll = el.scrollTop;
    el.innerHTML = `
      <header class="top-row">
        <button class="icon-btn" data-action="back" aria-label="Back to levels">⬅️</button>
        <h1 class="display">Shop</h1>
        ${Wallet.html()}
      </header>
      <div class="tabs" role="tablist" aria-label="Shop sections">
        <button class="tab" role="tab" id="tab-themes" aria-controls="shop-panel" aria-selected="${tab === 'themes'}" data-tab="themes">🎨 Themes</button>
        <button class="tab" role="tab" id="tab-powers" aria-controls="shop-panel" aria-selected="${tab === 'powers'}" data-tab="powers">⚡ Power-ups</button>
      </div>
      <div class="shop-list" id="shop-panel" role="tabpanel" aria-labelledby="tab-${tab}">
        ${tab === 'themes' ? THEMES.map(themeCard).join('') : POWERUPS.map(powerCard).join('')}
      </div>`;
    el.scrollTop = scroll;
    Wallet.sync();
  }

  async function buy(kind, id, btn) {
    const item = kind === 'theme' ? THEME_BY_ID.get(id) : POWERUP_BY_ID.get(id);
    if (!item) return;
    if (kind === 'theme' && Profile.ownsTheme(id)) { render(); return; }
    if (!Profile.canAfford(item.cost)) {
      AudioEngine.play('nope');
      FX.shake(btn);
      UI.toast(`You need ${item.cost - Profile.points} more ⭐. Practice to earn stars!`);
      return;
    }
    AudioEngine.play('tap');
    busy = true;
    const ok = await UI.confirm({
      title: `Buy ${item.name}?`,
      message: `It costs ⭐ ${item.cost}. You have ⭐ ${Profile.points}.`,
      yes: 'Yes, buy it!', no: 'Not now', icon: item.icon,
    });
    busy = false;
    if (!ok) return;
    const res = kind === 'theme' ? Profile.buyTheme(id) : Profile.buyPowerup(id);
    if (!res.ok) {
      AudioEngine.play('nope');
      UI.toast(res.reason === 'funds' ? 'Not enough stars yet!' : res.reason === 'owned' ? 'You already own this!' : 'That could not be bought.', { kind: 'bad' });
      render();
      return;
    }
    AudioEngine.play('coin');
    FX.confetti(70);
    UI.announce(`${item.name} bought. ${Profile.points} stars left.`);
    render();
    if (kind === 'theme') {
      busy = true;
      const equip = await UI.confirm({ title: `${item.name} unlocked!`, message: 'Want to use it right now?', yes: 'Equip it!', no: 'Later', icon: item.icon });
      busy = false;
      if (equip && Profile.equipTheme(id)) App.applyTheme();
      render();
    } else {
      UI.toast(`${item.icon} ${Util.esc(item.name)} added! You have ${Profile.count(id)}.`, { kind: 'good' });
    }
  }

  el.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t || busy) return;
    if (t.dataset.action === 'back') { AudioEngine.play('tap'); App.go('hub'); return; }
    if (t.dataset.action === 'shop' || t.dataset.noop) { AudioEngine.play('tap'); return; }
    if (t.dataset.tab) {
      AudioEngine.play('tap');
      if (tab !== t.dataset.tab) { tab = t.dataset.tab; el.scrollTop = 0; render(); }
      return;
    }
    if (t.dataset.equip) {
      AudioEngine.play('tap');
      const theme = THEME_BY_ID.get(t.dataset.equip);
      if (theme && Profile.equipTheme(theme.id)) {
        App.applyTheme();
        AudioEngine.play('whoosh');
        UI.toast(`${theme.icon} ${Util.esc(theme.name)} equipped!`, { kind: 'good' });
      }
      render();
      return;
    }
    if (t.dataset.buyTheme) { buy('theme', t.dataset.buyTheme, t); return; }
    if (t.dataset.buyPower) buy('power', t.dataset.buyPower, t);
  });

  return { name: 'shop', el, mount: render, destroy() {}, onBack() { App.go('hub'); return true; } };
};

Screens.settings = () => {
  const el = document.createElement('section');
  el.className = 'screen scroll settings';
  el.setAttribute('aria-label', 'Grown-ups settings');
  let range = Profile.range;
  let repeatTimer = 0;
  let repeatInterval = 0;
  let repeated = false;

  function rangeNote() {
    return `Biggest answer: ${9 * range.max} · up to ${EquationFactory.maxDigits(range)} digits on the keypad.`;
  }

  function render() {
    const s = Profile.state;
    const totals = CONFIG.LEVELS.reduce((acc, n) => {
      const L = Profile.level(n);
      acc.perfect += L.perfectPractices; acc.runs += L.practiceRuns; acc.sprints += L.sprintRuns; acc.review += L.reviewQueue.length;
      return acc;
    }, { perfect: 0, runs: 0, sprints: 0, review: 0 });
    el.innerHTML = `
      <header class="top-row">
        <button class="icon-btn" data-action="back" aria-label="Back to levels">⬅️</button>
        <h1 class="display">Grown-ups</h1>
      </header>
      <div class="settings-list">
        <section class="set-card panel" aria-labelledby="set-range">
          <h2 id="set-range" class="display">Number range</h2>
          <p>The secondary multiplication factor and division quotient use this range (default 1–25). Keep at least ${CONFIG.MIN_RANGE_SIZE} numbers in the range for varied questions. The divisor (the number after ÷) is never bigger than ${CONFIG.MAX_DIVISOR}. Zero is never used.</p>
          <div class="stepper"><label id="lbl-min">From</label><button class="icon-btn" data-step="min:-1" aria-label="Lower the smallest number">➖</button><output aria-labelledby="lbl-min" data-out="min" aria-live="polite">${range.min}</output><button class="icon-btn" data-step="min:1" aria-label="Raise the smallest number">➕</button></div>
          <div class="stepper"><label id="lbl-max">To</label><button class="icon-btn" data-step="max:-1" aria-label="Lower the biggest number">➖</button><output aria-labelledby="lbl-max" data-out="max" aria-live="polite">${range.max}</output><button class="icon-btn" data-step="max:1" aria-label="Raise the biggest number">➕</button></div>
          <p data-range-note>${rangeNote()}</p>
          <button class="btn btn-ghost" data-action="range-default">Reset to ${CONFIG.DEFAULT_RANGE.min}–${CONFIG.DEFAULT_RANGE.max}</button>
        </section>
        <section class="set-card panel" aria-labelledby="set-sound">
          <h2 id="set-sound" class="display">Sound &amp; feel</h2>
          <div class="toggle-row"><span id="t-sfx">Sound effects</span><button class="switch" role="switch" aria-checked="${s.settings.sfx}" aria-labelledby="t-sfx" data-toggle="sfx"></button></div>
          <div class="toggle-row"><span id="t-music">Focus music</span><button class="switch" role="switch" aria-checked="${s.settings.music}" aria-labelledby="t-music" data-toggle="music"></button></div>
          <div class="toggle-row"><span id="t-hap">Vibration (Android)</span><button class="switch" role="switch" aria-checked="${s.settings.haptics}" aria-labelledby="t-hap" data-toggle="haptics"></button></div>
        </section>
        <section class="set-card panel" aria-labelledby="set-stats">
          <h2 id="set-stats" class="display">Progress</h2>
          <div class="stat-grid">
            <div><b>${s.userPoints}</b>stars to spend</div>
            <div><b>${s.lifetimePoints}</b>stars earned</div>
            <div><b>${totals.perfect}</b>perfect practices</div>
            <div><b>${totals.runs}</b>practice runs</div>
            <div><b>${totals.sprints}</b>sprints</div>
            <div><b>${totals.review}</b>facts to rematch</div>
          </div>
          <p>${Store.healthy ? 'Progress is saved on this device only. Nothing is ever sent anywhere.' : '⚠️ This browser is not saving progress (private mode or blocked storage).'}</p>
        </section>
        <section class="set-card panel" aria-labelledby="set-reset">
          <h2 id="set-reset" class="display">Start over</h2>
          <p>Erase all stars, themes, power-ups and level progress on this device.</p>
          <button class="btn btn-danger" data-action="reset">Reset all progress</button>
        </section>
      </div>`;
  }

  function updateRange() {
    const minOut = el.querySelector('[data-out="min"]');
    const maxOut = el.querySelector('[data-out="max"]');
    const note = el.querySelector('[data-range-note]');
    if (minOut) minOut.textContent = String(range.min);
    if (maxOut) maxOut.textContent = String(range.max);
    if (note) note.textContent = rangeNote();
  }

  function clearRepeat() {
    clearTimeout(repeatTimer);
    clearInterval(repeatInterval);
    repeatTimer = 0;
    repeatInterval = 0;
  }

  function step(spec) {
    const [which, d] = spec.split(':');
    let { min, max } = range;
    if (which === 'min') min += Number(d); else max += Number(d);
    const lim = CONFIG.RANGE_LIMIT;
    if (min < lim.min || max > lim.max || max - min + 1 < CONFIG.MIN_RANGE_SIZE) {
      AudioEngine.play('nope');
      clearRepeat();
      return;
    }
    range = Profile.setRange(min, max);
    AudioEngine.play('tap');
    updateRange();
  }

  el.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    repeated = false;
    clearRepeat();
    repeatTimer = setTimeout(() => {
      repeated = true;
      repeatInterval = setInterval(() => step(b.dataset.step), 70);
    }, 450);
  });

  el.addEventListener('click', async e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.step) {
      if (repeated) { repeated = false; return; }
      step(t.dataset.step);
      return;
    }
    AudioEngine.play('tap');
    if (t.dataset.action === 'back') { App.go('hub'); return; }
    if (t.dataset.toggle) {
      const key = t.dataset.toggle;
      const on = !Profile.state.settings[key];
      Profile.setSetting(key, on);
      if (key === 'sfx') AudioEngine.setSfx(on);
      if (key === 'music') AudioEngine.setMusic(on);
      if (key === 'haptics' && on) FX.vibrate(40);
      t.setAttribute('aria-checked', String(on));
      return;
    }
    if (t.dataset.action === 'range-default') {
      range = Profile.setRange(CONFIG.DEFAULT_RANGE.min, CONFIG.DEFAULT_RANGE.max);
      updateRange();
      UI.toast(`Range reset to ${range.min}–${range.max}`);
      return;
    }
    if (t.dataset.action === 'reset') {
      const ok = await UI.confirm({ title: 'Erase everything?', message: 'All stars, themes, power-ups and progress on this device will be deleted. This cannot be undone.', yes: 'Erase', no: 'Cancel', icon: '⚠️', danger: true });
      if (!ok) return;
      const sure = await UI.confirm({ title: 'Really sure?', message: 'Last chance: tap Erase to start again from zero.', yes: 'Erase', no: 'Keep it', icon: '🗑️', danger: true });
      if (!sure) return;
      Profile.reset();
      App.applyTheme();
      range = Profile.range;
      render();
      UI.toast('Progress erased. Fresh start! 🌱');
    }
  });

  return {
    name: 'settings',
    el,
    mount() {
      render();
      window.addEventListener('pointerup', clearRepeat);
      window.addEventListener('pointercancel', clearRepeat);
    },
    destroy() {
      clearRepeat();
      window.removeEventListener('pointerup', clearRepeat);
      window.removeEventListener('pointercancel', clearRepeat);
    },
    onBack() { App.go('hub'); return true; },
  };
};

/* =====================================================================
   13. PLAY SCREEN — equation pane (top) + tactile keypad (bottom)
   ===================================================================== */
const CHEERS = ['Awesome!', 'On fire!', 'Math wizard!', 'Unstoppable!', 'Super brain!', 'Legendary!'];
const STREAK_CALLOUTS = new Set([3, 5, 10, 15, 20, 25, 30, 35, 40]);

Screens.play = ({ mode, level }) => {
  const session = new GameSession({ mode, level });
  const isSprint = mode === 'sprint';
  const isMaster = mode === 'master';
  const el = document.createElement('section');
  el.className = `screen play mode-${mode}`;
  el.setAttribute('aria-label', isMaster ? 'Master streak' : `Level ${level} ${isSprint ? 'Final Sprint' : 'practice'}`);
  const trayIds = isMaster ? [] : isSprint ? ['timeWarp', 'freezeRay', 'secondChance'] : ['secondChance'];

  el.innerHTML = `
    <div class="pane-eq">
      <header class="play-top">
        <button class="icon-btn sm" data-action="exit" aria-label="Leave this run">✖️</button>
        ${isSprint ? '<button class="icon-btn sm" data-action="pause" aria-label="Pause">⏸️</button>' : '<button class="icon-btn sm" data-action="restart" aria-label="Restart this practice" hidden>↻</button>'}
        <div class="play-title display">${isMaster ? 'Master · mixed tables' : `Level ${level} · ${isSprint ? 'Sprint' : 'Practice'}`}</div>
        ${isSprint ? `
          <div class="timer" data-timer hidden aria-hidden="true">
            <i class="timer-fill" data-ring></i>
            <span class="timer-text" data-time>${Util.fmtTime(CONFIG.SPRINT_DURATION_MS)}</span>
          </div>` : ''}
        ${Wallet.html(true)}
      </header>
      <div class="play-status">
        ${isMaster ? `
          <span class="eq-count">Equation <b data-qnum>1</b></span>
          <span class="score-pill">Streak: <b data-score>0</b></span>`
        : isSprint ? `
          <span class="eq-count">Equation <b data-qnum>1</b>/${session.total}</span>
          <span class="freeze-badge" data-freeze hidden>❄️ <b data-freeze-s>5</b>s</span>
          <span class="score-pill" aria-label="Correct answers">✓ <b data-score>0</b></span>
          <div class="progress" aria-hidden="true"><i data-progress></i></div>`
        : `
          <span class="eq-count">Equation <b data-qnum>1</b>/${session.total}</span>
          <span class="dots" aria-hidden="true">${session.queue.map(e => `<i class="${e.isReview ? 'rv' : ''}"></i>`).join('')}</span>`}
      </div>
      <div class="eq-stage">
        <div class="eq-card panel">
          <div class="eq" data-eq aria-hidden="true"></div>
          <div class="eq-sub" data-sub></div>
        </div>
        <div class="countdown" data-countdown hidden></div>
      </div>
      <div class="tray" data-tray>
        ${isMaster ? '<span class="badge streak">One mistake ends the streak</span>' : ''}
        ${trayIds.map(id => {
          const p = POWERUP_BY_ID.get(id);
          return `<button class="chip" data-power="${id}"><span class="ico" aria-hidden="true">${p.icon}</span><span class="chip-label${id === 'timeWarp' ? ' keep' : ''}">${p.chip}</span><span class="count" data-count>0</span>${id === 'timeWarp' ? '<span class="chip-note" data-note></span>' : ''}</button>`;
        }).join('')}
      </div>
    </div>
    <div class="keypad" role="group" aria-label="Number pad">
      ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button class="key" data-key="${k}" aria-label="${k}">${k}</button>`).join('')}
      <button class="key key-del" data-key="del" aria-label="Delete (hold to clear)"><span class="key-sym" aria-hidden="true">⌫</span></button>
      <button class="key" data-key="0" aria-label="0">0</button>
      <button class="key key-ok" data-key="ok" aria-label="Check answer"><span class="key-sym" aria-hidden="true">✓</span></button>
    </div>`;

  const $ = sel => el.querySelector(sel);
  const pane = $('.pane-eq');
  const card = $('.eq-card');
  const eqEl = $('[data-eq]');
  const subEl = $('[data-sub]');
  const trayEl = $('[data-tray]');
  const keypad = $('.keypad');
  const countdownEl = $('[data-countdown]');
  const qnumEl = $('[data-qnum]');
  const restartBtn = $('[data-action="restart"]');
  const dots = isSprint ? [] : Array.from(el.querySelectorAll('.dots i'));
  const timerEl = $('[data-timer]');
  const ringEl = $('[data-ring]');
  const timeEl = $('[data-time]');
  const freezeEl = $('[data-freeze]');
  const freezeSEl = $('[data-freeze-s]');
  const scoreEl = $('[data-score]');
  const progressEl = $('[data-progress]');
  let answerEl = null;
  let answerText = null;
  let promptEl = null;
  let pauseEntry = null;
  let exitOpen = false;
  let factTimer = 0;
  let factActive = false;
  let lastSecond = null;
  let wasFrozen = false;
  let delHold = 0;
  let controller = null;

  /* ---------- rendering helpers ---------- */
  function fitEquation() {
    const avail = card.clientWidth - 20;
    const availH = card.clientHeight;
    if (avail <= 0 || availH <= 0) return;
    let size = Math.max(22, Math.min(88, availH * 0.42));
    eqEl.style.setProperty('--eq-size', `${size}px`);
    let guard = 0;
    while (eqEl.scrollWidth > avail && size > 20 && guard < 40) {
      size = Math.floor(size * 0.93);
      eqEl.style.setProperty('--eq-size', `${size}px`);
      guard += 1;
    }
  }

  function renderEquation(eq) {
    const blank = eq.blank || 'c';
    eqEl.innerHTML = EquationFactory.parts(eq).map(([slot, v]) => (slot === blank
      ? '<span class="answer empty" data-answer><span class="answer-text"></span><span class="caret"></span></span>'
      : `<span class="eq-${slot}">${v}</span>`)).join('');
    answerEl = eqEl.querySelector('[data-answer]');
    answerText = answerEl.querySelector('.answer-text');
    fitEquation();
  }

  function renderInput(value) {
    if (!answerEl) return;
    answerText.textContent = value;
    answerEl.classList.toggle('empty', value === '');
  }

  function setSub(html) {
    if (isSprint && factActive) return;
    subEl.innerHTML = html;
  }

  function updateDots() {
    if (isSprint) return;
    dots.forEach((d, i) => {
      d.classList.toggle('ok', session.results[i] === 'ok');
      d.classList.toggle('bad', session.results[i] === 'bad');
      d.classList.toggle('now', i === session.index && !session.finished);
    });
  }

  function updateScore() {
    if (scoreEl) scoreEl.textContent = String(session.correct);
    if (progressEl) progressEl.style.width = `${((session.correct + session.wrong) / session.total) * 100}%`;
  }

  function reasonText(id, reason) {
    const p = POWERUP_BY_ID.get(id);
    switch (reason) {
      case 'none': return `You have no ${p.name} left. Get more in the Shop! 🛍️`;
      case 'mode': return `${p.icon} ${p.name} only works in the Final Sprint.`;
      case 'auto': return '🔄 Second Chance pops up by itself if you make a mistake.';
      case 'limit': return `⏱️ Max ${CONFIG.TIME_WARP_MAX_PER_RUN} Time Warps per sprint!`;
      case 'active': return '❄️ The clock is already frozen!';
      default: return 'Not right now. Try on the next question!';
    }
  }

  function renderTray() {
    trayIds.forEach(id => {
      const chip = trayEl.querySelector(`[data-power="${id}"]`);
      if (!chip) return;
      const p = POWERUP_BY_ID.get(id);
      const n = Profile.count(id);
      chip.querySelector('[data-count]').textContent = String(n);
      const note = chip.querySelector('[data-note]');
      if (note) note.textContent = `${session.used.timeWarp}/${CONFIG.TIME_WARP_MAX_PER_RUN}`;
      const check = session.canUse(id);
      const off = id === 'secondChance' ? n === 0 : !check.ok;
      chip.classList.toggle('off', off);
      chip.classList.toggle('active', id === 'freezeRay' && !!session.timer && session.timer.frozen);
      chip.classList.toggle('glow', id === 'secondChance' && session.phase === 'prompt' && n > 0);
      chip.setAttribute('aria-label', `${p.name}: ${n} left${id === 'timeWarp' ? `, ${session.used.timeWarp} of ${CONFIG.TIME_WARP_MAX_PER_RUN} used this sprint` : ''}`);
    });
  }

  function flashFact(eq) {
    clearTimeout(factTimer);
    factActive = true;
    subEl.innerHTML = `<span class="badge fact">✗ ${EquationFactory.text(eq)}</span>`;
    factTimer = setTimeout(() => {
      factActive = false;
      subEl.innerHTML = '';
    }, CONFIG.SPRINT_FACT_FLASH_MS);
  }

  function hidePrompt() {
    if (promptEl) { promptEl.remove(); promptEl = null; }
  }

  function showPrompt({ eq, charges, timed, windowMs }) {
    hidePrompt();
    promptEl = document.createElement('div');
    promptEl.className = 'prompt panel';
    promptEl.setAttribute('role', 'alertdialog');
    promptEl.setAttribute('aria-label', 'Second Chance');
    promptEl.innerHTML = `
      <h3 class="display">Oops! Not quite 🙈</h3>
      <p class="prompt-eq">${EquationFactory.puzzle(eq)}</p>
      <p>Use a Second Chance to try again?</p>
      <div class="prompt-actions">
        <button class="btn btn-good" data-prompt="use">🔄 Try again<small>${Util.plural(charges, 'charge', 'charges')} left</small></button>
        <button class="btn btn-ghost" data-prompt="skip">${isSprint ? 'Skip ➜' : 'Show me ➜'}</button>
      </div>
      ${timed ? `<div class="prompt-timer" aria-hidden="true"><i style="animation-duration:${windowMs}ms"></i></div>` : ''}`;
    pane.appendChild(promptEl);
    promptEl.addEventListener('click', e => {
      const b = e.target.closest('[data-prompt]');
      if (!b) return;
      AudioEngine.play('tap');
      if (b.dataset.prompt === 'use') session.useSecondChance();
      else session.declineSecondChance();
    });
    const first = promptEl.querySelector('[data-prompt="use"]');
    try { first.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
    UI.announce('Not quite. Use a Second Chance to try again?');
  }

  /* ---------- input ---------- */
  function pressVisual(btn) {
    btn.classList.add('is-pressed');
    clearTimeout(btn._pressT);
    btn._pressT = setTimeout(() => btn.classList.remove('is-pressed'), 140);
  }

  function handleKey(k) {
    if (session.paused || session.finished || UI.count > 0) return;
    if (session.phase !== 'asking') return;
    const res = session.press(k);
    if (k === 'ok') {
      if (!res.ok && res.reason === 'empty') {
        AudioEngine.play('nope');
        FX.shake(answerEl);
        UI.announce('Type an answer first');
      }
      return;
    }
    if (res.submitted) return;
    if (res.ok) AudioEngine.play('tap');
    else if (res.reason === 'leading-zero' || res.reason === 'max') {
      AudioEngine.play('nope');
      FX.shake(answerEl);
    }
  }

  function stopDelHold() {
    clearTimeout(delHold);
    delHold = 0;
  }

  keypad.addEventListener('pointerdown', e => {
    const btn = e.target.closest('[data-key]');
    if (!btn) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pressVisual(btn);
    handleKey(btn.dataset.key);
    if (btn.dataset.key === 'del') {
      stopDelHold();
      delHold = setTimeout(() => {
        delHold = 0;
        if (session.phase === 'asking' && session.input) { session.press('clear'); AudioEngine.play('whoosh'); }
      }, 500);
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => keypad.addEventListener(ev, stopDelHold));
  keypad.addEventListener('contextmenu', e => e.preventDefault());
  keypad.addEventListener('click', e => {
    if (e.detail !== 0) return; // pointer presses were already handled on pointerdown
    const btn = e.target.closest('[data-key]');
    if (!btn) return;
    pressVisual(btn);
    handleKey(btn.dataset.key);
  });

  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || UI.count > 0) return;
    const k = e.key;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== document.body;
    let key = null;
    if (/^[0-9]$/.test(k)) key = k;
    else if (k === 'Backspace' || k === 'Delete') key = 'del';
    else if (k === 'Enter' && !onButton) key = 'ok';
    else if (k === 'Escape') { e.preventDefault(); askExit(); return; }
    else if ((k === 'p' || k === 'P') && isSprint) { e.preventDefault(); if (!session.paused) session.pause('user'); return; }
    if (!key) return;
    e.preventDefault();
    if (session.phase === 'prompt' && key === 'ok') { session.useSecondChance(); return; }
    const btn = keypad.querySelector(`[data-key="${key}"]`);
    if (btn) pressVisual(btn);
    handleKey(key);
  }

  function onResize() { if (answerEl) fitEquation(); }

  /* ---------- pause / exit ---------- */
  function showPauseSheet(reason) {
    if (pauseEntry) return;
    pauseEntry = UI.open({
      center: true, opaque: true, dismissible: false, label: 'Paused',
      html: `<div class="dlg"><div class="dlg-icon" aria-hidden="true">⏸️</div><h2 class="display">Paused</h2>
        <p>${reason === 'hidden' ? 'We stopped the clock while you were away.' : 'The clock is stopped. Ready when you are!'}</p>
        <div class="dlg-actions"><button class="btn btn-good" data-p="resume" data-autofocus>▶ Resume</button><button class="btn btn-ghost" data-p="quit">Leave</button></div></div>`,
      onMount: sheet => sheet.addEventListener('click', async e => {
        const b = e.target.closest('[data-p]');
        if (!b) return;
        AudioEngine.play('tap');
        const entry = pauseEntry;
        pauseEntry = null;
        if (entry) entry.close();
        if (b.dataset.p === 'resume') { session.resume(); return; }
        const leave = await UI.confirm({ title: 'Leave this sprint?', message: 'Your sprint will stop. Stars you earned stay in your wallet.', yes: 'Leave', no: 'Keep playing', icon: '🚪', danger: true });
        if (leave) quit();
        else session.resume();
      }),
    });
  }

  async function askExit() {
    if (session.finished || exitOpen || pauseEntry) return;
    if (session.phase === 'idle') { quit(); return; }
    exitOpen = true;
    const wasPaused = session.paused;
    if (!wasPaused) session.pause('exit');
    const leave = await UI.confirm({
      title: 'Leave this run?',
      message: isMaster ? 'This unfinished Master run won’t go on the leaderboard.' : isSprint ? 'Your sprint will stop. Stars you earned stay in your wallet.' : 'This practice won’t count, but you keep the stars you earned.',
      yes: 'Leave', no: 'Keep playing', icon: '🚪', danger: true,
    });
    exitOpen = false;
    if (leave) { quit(); return; }
    if (!wasPaused) session.resume();
  }

  function quit() {
    session.abandon();
    if (App.screen === controller) App.go('hub');
  }

  /* Pointer presses on game-surface buttons must not steal focus, otherwise
     Enter would re-trigger the last tapped chip instead of submitting. */
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.play-top button, .tray .chip')) e.preventDefault();
  });

  el.addEventListener('click', e => {
    const t = e.target.closest('[data-action],[data-power]');
    if (!t || session.finished) return;
    if (t.dataset.power) {
      const id = t.dataset.power;
      const res = session.usePowerup(id);
      if (!res.ok) {
        AudioEngine.play('nope');
        FX.shake(t);
        UI.toast(reasonText(id, res.reason));
      }
      renderTray();
      return;
    }
    AudioEngine.play('tap');
    if (t.dataset.action === 'exit') askExit();
    else if (t.dataset.action === 'pause') { if (!session.paused) session.pause('user'); }
    else if (t.dataset.action === 'restart') {
      session.abandon();
      App.go('play', { mode: 'practice', level });
    }
  });

  /* ---------- session events ---------- */
  session.on('phase', () => {
    renderTray();
    keypad.classList.toggle('locked', session.phase !== 'asking');
  });

  session.on('countdown', ({ label, final }) => {
    countdownEl.hidden = false;
    countdownEl.innerHTML = `<span>${label}</span>`;
    subEl.innerHTML = '<span class="badge streak">Get ready! ⚡</span>';
    AudioEngine.play('count', final);
  });

  session.on('question', ({ eq, index }) => {
    countdownEl.hidden = true;
    renderEquation(eq);
    qnumEl.textContent = String(index + 1);
    updateDots();
    updateScore();
    if (eq.isReview) setSub('<span class="badge rematch">🔁 Rematch!</span>');
    else if (isMaster) subEl.innerHTML = `<span class="badge streak">Table ×${eq.level}</span>`;
    else if (!factActive) subEl.innerHTML = '';
    UI.announce(`Equation ${index + 1}: ${EquationFactory.spoken(eq)}`);
  });

  session.on('input', value => renderInput(value));

  session.on('correct', ({ streak, review, retried }) => {
    if (answerEl) { answerEl.classList.remove('empty', 'bad'); answerEl.classList.add('ok'); }
    AudioEngine.play('correct');
    FX.burstFrom(answerEl, isSprint ? 8 : 14);
    if (!isMaster) FX.floatText('+1 ⭐', answerEl, el.querySelector('.wallet'));
    if (review && review.cleared) setSub('<span class="badge good">🏅 Rematch won! Cleared!</span>');
    else if (review && review.streak === 1) setSub('<span class="badge good">🔁 Nice! Once more to clear it</span>');
    else if (retried) setSub('<span class="badge good">Phew! Saved by Second Chance 🔄</span>');
    else if (STREAK_CALLOUTS.has(streak)) setSub(`<span class="badge streak">🔥 ${streak} in a row! ${CHEERS[Math.min(CHEERS.length - 1, Math.floor(streak / 5))]}</span>`);
    updateDots();
    updateScore();
    UI.announce('Correct!');
  });

  session.on('wrong', () => {
    if (answerEl) { answerEl.classList.remove('empty'); answerEl.classList.add('bad'); }
    FX.shake(answerEl);
    AudioEngine.play('wrong');
    FX.vibrate(35);
  });

  session.on('prompt', data => {
    showPrompt(data);
    renderTray();
  });

  session.on('retry', () => {
    hidePrompt();
    if (answerEl) answerEl.classList.remove('bad', 'ok');
    renderInput('');
    AudioEngine.play('whoosh');
    setSub('<span class="badge streak">🔄 Second Chance! Try again</span>');
    renderTray();
    UI.announce('Try again!');
  });

  session.on('reveal', ({ eq, given, justFailed }) => {
    hidePrompt();
    if (isSprint) {
      flashFact(eq);
    } else {
      if (answerEl) {
        answerEl.classList.remove('bad', 'empty');
        answerEl.classList.add('reveal');
        answerText.innerHTML = `<span class="struck">${Util.esc(given)}</span>${eq.target}`;
        fitEquation();
      }
      if (justFailed) {
        subEl.innerHTML = '<span class="badge fail">💔 Perfect run lost. Keep going for ⭐ or tap ↻</span>';
        if (restartBtn) restartBtn.hidden = false;
      } else {
        subEl.innerHTML = `<span class="badge fact">${EquationFactory.text(eq)}</span>`;
      }
    }
    updateDots();
    updateScore();
    UI.announce(`The answer is ${eq.target}. ${EquationFactory.text(eq)}`);
  });

  session.on('tick', t => {
    const frac = Math.min(1, t.remaining / CONFIG.SPRINT_DURATION_MS);
    ringEl.style.transform = `scaleX(${frac})`;
    const secs = Math.ceil(t.remaining / 1000);
    if (secs !== lastSecond) {
      timeEl.textContent = Util.fmtTime(t.remaining);
      if (lastSecond !== null && secs < lastSecond) {
        if (secs <= 10 && secs > 0) AudioEngine.play('tick');
        if (secs === 30 || secs === 10) UI.announce(`${secs} seconds left`);
      }
      lastSecond = secs;
    }
    timerEl.classList.toggle('warn', t.remaining <= 30000 && t.remaining > 10000);
    timerEl.classList.toggle('danger', t.remaining <= 10000);
    const frozen = t.frozen;
    timerEl.classList.toggle('frozen', frozen);
    if (frozen) freezeSEl.textContent = String(Math.max(1, Math.ceil(t.freezeLeft / 1000)));
    if (frozen !== wasFrozen) {
      wasFrozen = frozen;
      freezeEl.hidden = !frozen;
      renderTray();
    }
  });

  session.on('warp', () => {
    AudioEngine.play('warp');
    FX.floatText('+10s', card, null);
    if (timerEl) { timerEl.classList.remove('bump'); void timerEl.offsetWidth; timerEl.classList.add('bump'); }
    UI.toast('⏱️ +10 seconds!', { kind: 'good', ms: 1200 });
    UI.announce('10 more seconds!');
    renderTray();
  });

  session.on('freeze', () => {
    AudioEngine.play('freeze');
    UI.toast('❄️ Clock frozen for 5 seconds!', { kind: 'good', ms: 1200 });
    UI.announce('Clock frozen for 5 seconds');
    renderTray();
  });

  session.on('pause', ({ reason }) => {
    el.classList.add('is-paused');
    if (reason !== 'exit') showPauseSheet(reason);
  });

  session.on('resume', () => el.classList.remove('is-paused'));

  session.on('finish', summary => {
    hidePrompt();
    el.classList.remove('is-paused');
    keypad.classList.add('locked');
    if (pauseEntry) { const p = pauseEntry; pauseEntry = null; p.close(); }
    if (summary.reason === 'timeout') {
      clearTimeout(factTimer);
      factActive = false;
      subEl.innerHTML = '<span class="badge fail">⏰ Time’s up!</span>';
      AudioEngine.play('whoosh');
    }
    setTimeout(() => {
      if (App.screen === controller) App.go(summary.mode === 'master' ? 'masterResults' : 'results', { summary });
    }, summary.reason === 'timeout' ? 1000 : 650);
  });

  controller = {
    name: 'play',
    el,
    session,
    mount() {
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('resize', onResize);
      renderTray();
      session.start();
    },
    destroy() {
      session.abandon();
      hidePrompt();
      stopDelHold();
      clearTimeout(factTimer);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('resize', onResize);
      if (pauseEntry) { const p = pauseEntry; pauseEntry = null; p.close(); }
    },
    onBack() {
      if (!session.finished) askExit();
      return true;
    },
    onHidden() {
      if (isSprint && !session.finished && !session.paused && session.phase !== 'idle') session.pause('hidden');
    },
  };
  return controller;
};

/* =====================================================================
   14. RESULTS SCREEN
   ===================================================================== */
Screens.results = ({ summary }) => {
  const s = summary;
  const el = document.createElement('section');
  el.className = 'screen scroll results';
  el.setAttribute('aria-label', 'Results');
  const L = Profile.level(s.level);
  const unlocked = Profile.isSprintUnlocked(s.level);
  const missed = s.missed.slice(0, 16).map(m => `<li>${EquationFactory.text(m.eq)}</li>`).join('');
  let title;
  let sub;
  let extra = '';
  let actions;
  let celebrate = 'none';

  if (s.mode === 'practice') {
    const done = Math.min(L.perfectPractices, CONFIG.PERFECT_RUNS_TO_UNLOCK);
    if (s.perfect) {
      title = 'Perfect run! 🎉';
      sub = s.record.justUnlocked ? 'Three perfect runs — you did it!' : `Perfect practices: ${done}/${CONFIG.PERFECT_RUNS_TO_UNLOCK}`;
      celebrate = s.record.justUnlocked ? 'unlock' : 'perfect';
    } else {
      title = s.correct >= 8 ? 'So close! 💪' : s.correct >= 5 ? 'Good effort! 🌟' : 'Keep practicing! 🚀';
      sub = 'A perfect run needs 10/10. Let’s go again!';
    }
    extra += `<div class="res-stats"><span><span class="pips" aria-hidden="true">${pipsHTML(done)}</span> ${unlocked ? 'Practice complete ✅' : `Perfect practices ${done}/${CONFIG.PERFECT_RUNS_TO_UNLOCK}`}</span>`;
    if (s.reviewCleared) extra += `<span>🏅 ${Util.plural(s.reviewCleared, 'rematch', 'rematches')} cleared</span>`;
    if (s.reviewLeft) extra += `<span>🔁 ${Util.plural(s.reviewLeft, 'rematch', 'rematches')} waiting</span>`;
    if (s.used.secondChance) extra += `<span>🔄 ${Util.plural(s.used.secondChance, 'Second Chance', 'Second Chances')} used</span>`;
    extra += '</div>';
    if (s.record.justUnlocked) extra = `<div class="unlock-banner">🔓 FINAL SPRINT UNLOCKED!</div>${extra}`;
    actions = (s.record.justUnlocked || (unlocked && s.perfect))
      ? `<button class="btn btn-big btn-good" data-go="sprint" data-autofocus>⚡ Start Final Sprint</button>
         <button class="btn btn-alt" data-go="practice">▶ Practice</button><button class="btn" data-go="hub">🏠 Levels</button>`
      : `<button class="btn btn-big btn-good" data-go="practice" data-autofocus>▶ Practice again</button>
         ${unlocked ? '<button class="btn btn-alt" data-go="sprint">⚡ Sprint</button>' : ''}<button class="btn" data-go="hub">🏠 Levels</button>`;
  } else {
    const perfect = s.correct === CONFIG.SPRINT_LENGTH;
    if (perfect) title = 'LEGENDARY! 👑';
    else if (s.finishedAll) title = 'All 40 done! 🏁';
    else title = 'Time’s up! ⏰';
    const accuracy = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
    if (s.record.firstRun) sub = '🏆 Your first sprint score!';
    else if (s.record.newBest) sub = `🏆 New best! (was ${s.record.prevBest})`;
    else sub = `Best: ${L.sprintBest}/${CONFIG.SPRINT_LENGTH}`;
    if (perfect || s.record.newBest || s.record.firstRun) celebrate = perfect ? 'unlock' : 'perfect';
    extra += `<div class="res-stats">
      <span>🎯 ${accuracy}% right</span>
      <span>⏱️ ${Util.fmtTime(s.timeUsedMs)} used</span>
      ${s.finishedAll ? `<span>⚡ ${Util.fmtTime(s.timeLeftMs)} to spare</span>` : `<span>📝 ${s.answered}/${s.total} answered</span>`}
      ${s.bestStreak >= 3 ? `<span>🔥 Best streak ${s.bestStreak}</span>` : ''}
      ${s.record.newBestTime ? '<span>🚀 Fastest 40/40 sprint!</span>' : ''}
      ${L.perfect ? '<span class="badge ready" data-perfect-badge>Perfect level</span>' : ''}
      ${s.record.bonus ? `<span>+${s.record.bonus} stars for your first Perfect!</span>` : ''}
    </div>`;
    actions = `<button class="btn btn-big btn-good" data-go="sprint" data-autofocus>⚡ Sprint again</button>
      <button class="btn btn-alt" data-go="practice">▶ Practice</button><button class="btn" data-go="hub">🏠 Levels</button>`;
  }

  el.innerHTML = `
    <div class="res-card panel">
      ${MASCOT_SVG('res-mascot mascot')}
      <h1 class="res-title display${celebrate !== 'none' ? ' stamp' : ''}">${title}</h1>
      <p class="res-sub">${sub}</p>
      <div class="res-score" aria-label="${s.correct} out of ${s.total}">${s.correct}<small>/${s.total}</small></div>
      <div class="res-points">+${s.points} ⭐</div>
      ${extra}
      ${missed ? `<p class="res-list-title">${s.mode === 'practice' ? 'Rematch list — remember these:' : 'Facts to remember:'}</p><ul class="res-list">${missed}</ul>` : ''}
    </div>
    <div class="res-actions">${actions}</div>`;

  el.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    AudioEngine.play('tap');
    const go = b.dataset.go;
    if (go === 'hub') App.go('hub');
    else App.go('play', { mode: go, level: s.level });
  });

  return {
    name: 'results',
    el,
    mount() {
      UI.announce(`${title.replace(/[^\w\s!'’/]/g, '')}. ${s.correct} out of ${s.total}. You earned ${s.points} stars.`);
      if (celebrate === 'unlock') { AudioEngine.play('unlock'); FX.confetti(170); }
      else if (celebrate === 'perfect') { AudioEngine.play('fanfare'); FX.confetti(120); }
      else if (s.points > 0) AudioEngine.play('coin');
      requestAnimationFrame(() => {
        const f = el.querySelector('[data-autofocus]');
        if (f) { try { f.focus({ preventScroll: true }); } catch (err) { /* ignore */ } }
      });
    },
    destroy() {},
    onBack() { App.go('hub'); return true; },
  };
};

/* =====================================================================
   15. APP — screen router (state machine), theme application, boot
   ===================================================================== */
const App = {
  screen: null,
  host: document.getElementById('screen-host'),
  externalChange: false,

  go(name, params = {}) {
    const factory = Screens[name];
    if (!factory) return;
    UI.closeAll();
    UI.clearToasts();
    if (this.screen) {
      try { this.screen.destroy(); } catch (err) { console.error('[MathSprints] destroy', err); }
      this.screen.el.remove();
    }
    if (this.externalChange && name !== 'play') {
      this.externalChange = false;
      Profile.reloadFromStorage();
      this.applyTheme();
    }
    const screen = factory(params);
    this.screen = screen;
    document.body.classList.toggle('playing', name === 'play');
    screen.el.setAttribute('tabindex', '-1');
    this.host.appendChild(screen.el);
    screen.mount();
    if (name !== 'hub') Nav.arm();
    if (name !== 'play' && name !== 'results') {
      try { screen.el.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
    }
  },

  handleBack() {
    const top = UI.top();
    if (top) {
      if (top.dismissible) top.close();
      return true;
    }
    if (this.screen && this.screen.onBack) return this.screen.onBack();
    return false;
  },

  applyTheme() {
    const id = Profile.state.themes.active;
    document.body.dataset.theme = THEME_BY_ID.has(id) ? id : 'sunny';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.body).getPropertyValue('--meta-color').trim() || '#7dd3fc');
  },

  init() {
    const status = Profile.load();
    this.applyTheme();
    AudioEngine.setSfx(Profile.state.settings.sfx);
    AudioEngine.setMusic(Profile.state.settings.music);
    Bus.on('profile:change', () => Wallet.sync());
    Bus.on('storage:warning', () => UI.toast('⚠️ Progress could not be saved on this device.', { kind: 'bad', ms: 3500 }));
    // Browsers only allow audio after a user gesture; iOS counts pointerup/touchend/click, not pointerdown.
    const unlockAudio = () => AudioEngine.unlock();
    ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
    document.addEventListener('visibilitychange', () => {
      AudioEngine.onVisibility(document.hidden);
      if (document.hidden && this.screen && this.screen.onHidden) this.screen.onHidden();
    });
    window.addEventListener('pagehide', () => { if (Profile.state) Store.write(Profile.state); });
    window.addEventListener('storage', e => {
      if (e.key !== Store.KEY) return;
      if (this.screen && this.screen.name === 'play') { this.externalChange = true; return; }
      if (Profile.reloadFromStorage()) {
        this.applyTheme();
        AudioEngine.setSfx(Profile.state.settings.sfx);
      }
    });
    window.addEventListener('resize', () => FX.resize());
    Nav.init();
    this.go('hub');
    if (status === 'corrupt') UI.toast('Saved progress was damaged, so we started fresh.', { kind: 'bad', ms: 4000 });
    if (!Store.available) UI.toast('⚠️ This browser is not saving progress (private mode?).', { kind: 'bad', ms: 4000 });
  },
};

window.MathSprints = Object.freeze({
  version: '1.0.0', CONFIG, THEMES, POWERUPS, Util, RNG, Bus, Store, Profile,
  EquationFactory, Learning, ReviewQueue, GameSession, SprintTimer, Delay, AudioEngine, UI, App,
});
Object.defineProperty(window, 'UserPoints', { get: () => Profile.points, configurable: true });

try {
  App.init();
} catch (err) {
  console.error('[MathSprints] failed to start', err);
  const host = document.getElementById('screen-host');
  host.innerHTML = '<section class="screen"><div class="panel" style="padding:20px;margin:auto;text-align:center"><h1 class="display">Oops! 🙈</h1><p>Math Sprints could not start. Please reload the page.</p></div></section>';
}
})();
</script>
</body>
