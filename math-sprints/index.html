    let n = NaN;
    if (typeof value === 'number') n = value;
    else if (typeof value === 'string' && value.trim() !== '') n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Util.clamp(Math.trunc(n), lo, hi);
  },
  bool: (value, fallback) => (typeof value === 'boolean' ? value : fallback),
  esc: s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  fmtTime(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  },
  fmtSecs: ms => `${(Math.max(0, ms) / 1000).toFixed(1)}s`,
  plural: (n, one, many) => `${n} ${n === 1 ? one : many}`,
  digits: n => String(Math.abs(Math.trunc(n))).length,
  reducedMotion: () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),
};

const RNG = (() => {
  const mulberry32 = seed => () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let seeded = null;
  try {
    const seedParam = new URLSearchParams(window.location.search).get('seed');
    if (seedParam && /^\d{1,10}$/.test(seedParam)) seeded = mulberry32(Number(seedParam));
  } catch (err) { seeded = null; }
  const buf = new Uint32Array(1);
  const hasCrypto = !!(window.crypto && window.crypto.getRandomValues);
  function random() {
    if (seeded) return seeded();
    if (hasCrypto) { window.crypto.getRandomValues(buf); return buf[0] / 4294967296; }
    return Math.random();
  }
  return {
    random,
    int: (lo, hi) => lo + Math.floor(random() * (hi - lo + 1)),
    pick: list => list[Math.floor(random() * list.length)],
    shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    seed(n) { seeded = mulberry32(n >>> 0); },
    unseed() { seeded = null; },
  };
})();

/* Tiny pub/sub so modules never reach into each other's DOM. */
const Bus = (() => {
  const map = new Map();
  return {
    on(evt, fn) {
      if (!map.has(evt)) map.set(evt, new Set());
      map.get(evt).add(fn);
      return () => map.get(evt).delete(fn);
    },
    emit(evt, data) {
      const set = map.get(evt);
      if (!set) return;
      Array.from(set).forEach(fn => {
        try { fn(data); } catch (err) { console.error('[MathSprints]', evt, err); }
      });
    },
  };
})();

/* =====================================================================
   3. STORE — resilient localStorage abstraction (memory fallback)
   ===================================================================== */
const Store = (() => {
  const KEY = CONFIG.STORAGE_KEY;
  let ls = null;
  let memoryCopy = null;
  let lastWriteOk = true;
  try {
    const probe = '__mathSprints_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    ls = window.localStorage;
  } catch (err) {
    ls = null;
  }
  return {
    KEY,
    get available() { return ls !== null; },
    get healthy() { return ls !== null && lastWriteOk; },
    read() {
      let raw = memoryCopy;
      if (ls) {
        try { raw = ls.getItem(KEY); } catch (err) { raw = memoryCopy; }
      }
      if (raw === null || raw === undefined) return { status: 'empty', data: null };
      try {
        return { status: 'ok', data: JSON.parse(raw) };
      } catch (err) {
        if (ls) { try { ls.setItem(`${KEY}.corrupt`, String(raw).slice(0, 200000)); } catch (e) { /* storage full: nothing else to do */ } }
        return { status: 'corrupt', data: null };
      }
    },
    write(obj) {
      let raw;
      try { raw = JSON.stringify(obj); } catch (err) { lastWriteOk = false; return false; }
      memoryCopy = raw;
      if (!ls) { lastWriteOk = false; return false; }
      try { ls.setItem(KEY, raw); lastWriteOk = true; return true; } catch (err) { lastWriteOk = false; return false; }
    },
    remove() {
      memoryCopy = null;
      if (ls) { try { ls.removeItem(KEY); } catch (err) { /* ignore */ } }
    },
  };
})();

/* =====================================================================
   4. PROFILE — the only persistent state; every mutation goes through here
   ===================================================================== */
const Profile = (() => {
  let state = null;
  let warned = false;

  const newLevel = () => ({ perfectPractices: 0, practiceRuns: 0, sprintRuns: 0, sprintBest: 0, sprintPerfects: 0, sprintBestTimeMs: null, perfect: false, reviewQueue: [], learning: {}, learningRun: 0 });

  function defaults() {
    const levels = {};
    CONFIG.LEVELS.forEach(n => { levels[n] = newLevel(); });
    const now = Date.now();
    return {
      version: CONFIG.SCHEMA_VERSION,
      userPoints: 0,
      lifetimePoints: 0,
      themes: { owned: ['sunny'], active: 'sunny' },
      inventory: Object.fromEntries(POWERUPS.map(p => [p.id, 0])),
      settings: { sfx: true, music: false, haptics: true, range: { min: CONFIG.DEFAULT_RANGE.min, max: CONFIG.DEFAULT_RANGE.max } },
      levels,
      master: { best: 0, runs: 0, leaderboard: [] },
      createdAt: now,
      updatedAt: now,
    };
  }

  function sanitizeRange(r, minimumSize = CONFIG.MIN_RANGE_SIZE) {
    const lim = CONFIG.RANGE_LIMIT;
    let min = Util.int(r && r.min, CONFIG.DEFAULT_RANGE.min, lim.min, lim.max);
    let max = Util.int(r && r.max, CONFIG.DEFAULT_RANGE.max, lim.min, lim.max);
    if (min > max) [min, max] = [max, min];
    if (max - min + 1 < minimumSize) {
      max = Math.min(lim.max, min + minimumSize - 1);
      min = Math.min(min, max - minimumSize + 1);
    }
    return { min, max };
  }

  function migrate(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const version = Util.int(raw.version, 1, 0, 1e6);
    // Schema upgrades are applied here in order, e.g. if (version < 2) { ... }.
    if (version > CONFIG.SCHEMA_VERSION) return raw;
    return raw;
  }

  function sanitize(raw) {
    const out = defaults();
    if (!raw) return out;
    out.userPoints = Util.int(raw.userPoints, 0, 0, 1e7);
    out.lifetimePoints = Math.max(out.userPoints, Util.int(raw.lifetimePoints, 0, 0, 1e9));
    const themes = raw.themes && typeof raw.themes === 'object' ? raw.themes : {};
    const owned = Array.isArray(themes.owned) ? themes.owned.filter(id => THEME_BY_ID.has(id)) : [];
    out.themes.owned = Array.from(new Set(['sunny', ...owned]));
    out.themes.active = out.themes.owned.includes(themes.active) ? themes.active : 'sunny';
    const inv = raw.inventory && typeof raw.inventory === 'object' ? raw.inventory : {};
    POWERUPS.forEach(p => { out.inventory[p.id] = Util.int(inv[p.id], 0, 0, CONFIG.MAX_INVENTORY); });
    const s = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    out.settings.sfx = Util.bool(s.sfx, true);
    out.settings.music = Util.bool(s.music, false);
    out.settings.haptics = Util.bool(s.haptics, true);
    out.settings.range = sanitizeRange(s.range);
    const levels = raw.levels && typeof raw.levels === 'object' ? raw.levels : {};
    CONFIG.LEVELS.forEach(n => {
      const src = levels[n] && typeof levels[n] === 'object' ? levels[n] : {};
      const L = out.levels[n];
      L.perfectPractices = Util.int(src.perfectPractices, 0, 0, 1e6);
      L.practiceRuns = Math.max(L.perfectPractices, Util.int(src.practiceRuns, 0, 0, 1e6));
      L.sprintRuns = Util.int(src.sprintRuns, 0, 0, 1e6);
      L.sprintBest = Math.min(Util.int(src.sprintBest, 0, 0, CONFIG.SPRINT_LENGTH), L.sprintRuns > 0 ? CONFIG.SPRINT_LENGTH : 0);
      L.sprintPerfects = Math.min(Util.int(src.sprintPerfects, 0, 0, 1e6), L.sprintRuns);
      L.perfect = Util.bool(src.perfect, false) && L.sprintPerfects > 0 && L.sprintBest === CONFIG.SPRINT_LENGTH;
      L.sprintBestTimeMs = src.sprintBestTimeMs === null || src.sprintBestTimeMs === undefined ? null : Util.int(src.sprintBestTimeMs, null, 0, 36e5);
      const reviews = new Map();
      (Array.isArray(src.reviewQueue) ? src.reviewQueue : []).forEach(rawItem => {
        const item = ReviewQueue.sanitizeItem(rawItem, n);
        if (!item) return;
        const previous = reviews.get(item.key);
        if (previous) {
          previous.misses = Math.min(1e6, previous.misses + item.misses);
          previous.streak = Math.min(previous.streak, item.streak);
          previous.addedAt = Math.min(previous.addedAt, item.addedAt);
          previous.lastSeenAt = Math.max(previous.lastSeenAt, item.lastSeenAt);
        } else reviews.set(item.key, item);
      });
      L.reviewQueue = Array.from(reviews.values()).slice(0, CONFIG.REVIEW_QUEUE_MAX);
      L.learningRun = Util.int(src.learningRun, 0, 0, 1e9);
      const learning = src.learning && typeof src.learning === 'object' && !Array.isArray(src.learning) ? src.learning : {};
      Object.entries(learning).forEach(([family, evidence]) => {
        const secondary = Number(family);
        if (String(secondary) === family && Number.isInteger(secondary) && secondary >= 1
          && n * secondary <= 9999 && evidence && typeof evidence === 'object') {
          L.learning[family] = Learning.sanitize(evidence, L.learningRun);
        }
      });
      const legacyFamilies = new Map();
      L.reviewQueue.forEach(item => {
        const family = Learning.family(item, n);
        legacyFamilies.set(family, Math.min(1e6, (legacyFamilies.get(family) || 0) + item.misses));
      });
      legacyFamilies.forEach((misses, family) => {
        if (!L.learning[family]) L.learning[family] = Learning.sanitize({ misses });
      });
    });
    const master = raw.master && typeof raw.master === 'object' ? raw.master : {};
    out.master.leaderboard = (Array.isArray(master.leaderboard) ? master.leaderboard : [])
      .filter(entry => entry && typeof entry === 'object' && Number.isInteger(entry.streak) && entry.streak >= 0)
      .map(entry => ({
        streak: Util.int(entry.streak, 0, 0, 1e6),
        at: Util.int(entry.at, 0, 0, 8.64e15),
        range: sanitizeRange(entry.range, 1),
      }))
      .sort((a, b) => b.streak - a.streak || a.at - b.at)
      .slice(0, CONFIG.MASTER_LEADERBOARD_MAX);
    out.master.best = Math.max(Util.int(master.best, 0, 0, 1e6), ...out.master.leaderboard.map(entry => entry.streak));
    out.master.runs = Math.max(Util.int(master.runs, 0, 0, 1e9), out.master.leaderboard.length);
    out.createdAt = Util.int(raw.createdAt, out.createdAt, 0, 8.64e15);
    return out;
  }

  function commit(reason) {
    state.updatedAt = Date.now();
    const ok = Store.write(state);
    if (!ok && !warned) { warned = true; Bus.emit('storage:warning', { available: Store.available }); }
    Bus.emit('profile:change', { reason });
  }

  return {
    load() {
      const res = Store.read();
      state = sanitize(migrate(res.data));
      Store.write(state);
      return res.status;
    },
    reloadFromStorage() {
      const res = Store.read();
      if (res.status !== 'ok') return false;
      state = sanitize(migrate(res.data));
      Bus.emit('profile:change', { reason: 'external' });
      return true;
    },
    commit,
    sanitizeRange,
    get state() { return state; },
    get points() { return state.userPoints; },
    get range() { return { min: state.settings.range.min, max: state.settings.range.max }; },
    level: n => state.levels[n],
    isSprintUnlocked: n => state.levels[n].perfectPractices >= CONFIG.PERFECT_RUNS_TO_UNLOCK,
    earn(amount) {
      const n = Util.int(amount, 0, 0, 1000);
      if (!n) return;
      state.userPoints += n;
      state.lifetimePoints += n;
      commit('earn');
    },
    canAfford: cost => Number.isInteger(cost) && cost >= 0 && state.userPoints >= cost,
    ownsTheme: id => state.themes.owned.includes(id),
    buyTheme(id) {
      const theme = THEME_BY_ID.get(id);
      if (!theme) return { ok: false, reason: 'unknown' };
      if (state.themes.owned.includes(id)) return { ok: false, reason: 'owned' };
      if (!Profile.canAfford(theme.cost)) return { ok: false, reason: 'funds' };
      state.userPoints -= theme.cost;
      state.themes.owned.push(id);
      commit('buy-theme');
      return { ok: true };
    },
    equipTheme(id) {
      if (!state.themes.owned.includes(id)) return false;
      state.themes.active = id;
      commit('theme');
      return true;
    },
    buyPowerup(id) {
      const p = POWERUP_BY_ID.get(id);
      if (!p) return { ok: false, reason: 'unknown' };
      if (state.inventory[id] >= CONFIG.MAX_INVENTORY) return { ok: false, reason: 'full' };
      if (!Profile.canAfford(p.cost)) return { ok: false, reason: 'funds' };
      state.userPoints -= p.cost;
      state.inventory[id] += 1;
      commit('buy-powerup');
      return { ok: true };
    },
    count: id => state.inventory[id] || 0,
    consume(id) {
      if (!(state.inventory[id] > 0)) return false;
      state.inventory[id] -= 1;
      commit('consume');
      return true;
    },
    setSetting(key, value) {
      if (!['sfx', 'music', 'haptics'].includes(key)) return;
      state.settings[key] = !!value;
      commit('settings');
    },
    setRange(min, max) {
      state.settings.range = sanitizeRange({ min, max });
      commit('settings');
      return Profile.range;
    },
    beginPractice(n) {
      state.levels[n].learningRun += 1;
      commit('practice-start');
      return state.levels[n].learningRun;
    },
    recordMaster(streak, range) {
      const master = state.master;
      const previous = master.best;
      master.best = Math.max(previous, streak);
      master.runs += 1;
      master.leaderboard.push({ streak, at: Date.now(), range: { ...range } });
      master.leaderboard.sort((a, b) => b.streak - a.streak || a.at - b.at);
      master.leaderboard.length = Math.min(master.leaderboard.length, CONFIG.MASTER_LEADERBOARD_MAX);
      commit('master');
      return { newBest: streak > previous, best: master.best };
    },
    recordPractice(n, perfect) {
      const L = state.levels[n];
      const wasUnlocked = L.perfectPractices >= CONFIG.PERFECT_RUNS_TO_UNLOCK;
      L.practiceRuns += 1;
      if (perfect) L.perfectPractices += 1;
      commit('practice');
      return { perfectPractices: L.perfectPractices, justUnlocked: !wasUnlocked && L.perfectPractices >= CONFIG.PERFECT_RUNS_TO_UNLOCK };
    },
    recordSprint(n, { score, timeMs, finishedAll, noPowerups = false, timeLeftMs = 0 }) {
      const L = state.levels[n];
      const prevBest = L.sprintBest;
      const firstRun = L.sprintRuns === 0;
      const s = Util.int(score, 0, 0, CONFIG.SPRINT_LENGTH);
      L.sprintRuns += 1;
      const newBest = s > prevBest;
      if (newBest) L.sprintBest = s;
      const perfect = s === CONFIG.SPRINT_LENGTH;
      let newBestTime = false;
      if (perfect) {
        L.sprintPerfects += 1;
        if (finishedAll && (L.sprintBestTimeMs === null || timeMs < L.sprintBestTimeMs)) {
          L.sprintBestTimeMs = Math.round(timeMs);
          newBestTime = true;
        }
      }
      const perfectLevel = perfect && finishedAll && noPowerups && timeLeftMs > 0;
      const justPerfected = perfectLevel && !L.perfect;
      const bonus = justPerfected ? CONFIG.PERFECT_LEVEL_BONUS : 0;
      if (justPerfected) {
        L.perfect = true;
        state.userPoints += bonus;
        state.lifetimePoints += bonus;
      }
      commit('sprint');
      return { newBest, firstRun, prevBest, perfect, newBestTime, perfectLevel, justPerfected, bonus };
    },
    reset() {
      const keepSettings = { sfx: state.settings.sfx, music: state.settings.music, haptics: state.settings.haptics };
      state = defaults();
      Object.assign(state.settings, keepSettings);
      commit('reset');
    },
  };
})();

/* =====================================================================
   5. EQUATION FACTORY — pure generation & validation (no zeros ever)
   ===================================================================== */
const EquationFactory = (() => {
  const SYMBOL = Object.freeze({ mul: '×', div: '÷' });

  const BLANKS = Object.freeze(['a', 'b', 'c']);

  function make(op, a, b) {
    const answer = op === 'mul' ? a * b : a / b;
    return { key: `${a}${op === 'mul' ? 'x' : '/'}${b}`, op, a, b, answer };
  }

  /* Leave a focus multiplier, divisor or quotient visible, even when both factors equal the level. */
  function allowedBlanks(eq, level) {
    const focus = eq.op === 'mul'
      ? ['a', 'b'].filter(slot => eq[slot] === level)
      : [eq.b === level ? 'b' : null, eq.answer === level ? 'c' : null].filter(Boolean);
    return BLANKS.filter(slot => !focus.length || focus.some(visible => visible !== slot));
  }

  function withBlank(eq, blank, level) {
    const allowed = allowedBlanks(eq, level);
    const slot = allowed.includes(blank) ? blank : RNG.pick(allowed);
    return { ...eq, blank: slot, target: slot === 'a' ? eq.a : slot === 'b' ? eq.b : eq.answer };
  }

  function parts(eq) {
    return [['a', eq.a], ['op', SYMBOL[eq.op]], ['b', eq.b], ['eq', '='], ['c', eq.answer]];
  }

  function puzzle(eq) {
    return parts(eq).map(([slot, v]) => (slot === (eq.blank || 'c') ? '?' : v)).join(' ');
  }

  function spoken(eq) {
    const say = slot => (slot === (eq.blank || 'c') ? 'what' : slot === 'a' ? eq.a : slot === 'b' ? eq.b : eq.answer);
    return `${say('a')} ${eq.op === 'mul' ? 'times' : 'divided by'} ${say('b')} equals ${say('c')}`;
  }

  /* Level N must appear as a multiplier, as the divisor, or (spec: "Dividend ÷ S = N") as the quotient. */
  function validate(eq, level) {
    if (!eq || (eq.op !== 'mul' && eq.op !== 'div')) return false;
    const { a, b, answer } = eq;
    if (![a, b, answer].every(v => Number.isInteger(v) && v >= 1 && v <= 9999)) return false;
    if (eq.op === 'mul') return a * b === answer && (a === level || b === level);
    return b <= CONFIG.MAX_DIVISOR && a % b === 0 && a / b === answer && (b === level || answer === level);
  }

  function pool(level, range) {
    const map = new Map();
    for (let s = range.min; s <= range.max; s++) {
      const product = level * s;
      const forms = [make('mul', level, s), make('mul', s, level), make('div', product, level), make('div', product, s)];
      forms.forEach(eq => { if (validate(eq, level)) map.set(eq.key, eq); });
    }
    return Array.from(map.values());
  }

  /* Builds one run: review items (if any) at random slots, fresh equations elsewhere,
     50/50 operation mix with no more than MAX_SAME_OP_IN_A_ROW of one kind, no duplicates
     unless the pool is too small (then repeats, but never back-to-back). */
  function buildRun(level, count, range, { review = [], exclude = new Set() } = {}) {
    const all = pool(level, range);
    const fresh = { mul: [], div: [] };
    all.forEach(eq => { if (!exclude.has(eq.key)) fresh[eq.op].push(eq); });
    if (!fresh.mul.length && !fresh.div.length) all.forEach(eq => fresh[eq.op].push(eq));
    const bags = { mul: RNG.shuffle(fresh.mul), div: RNG.shuffle(fresh.div) };
    const reviewItems = Array.from(new Map(review
      .map(item => ReviewQueue.sanitizeItem(item, level))
      .filter(Boolean)
      .map(item => [item.key, item])).values()).slice(0, count);
    const reviewAt = new Map();
    RNG.shuffle(Array.from({ length: count }, (_, i) => i))
      .slice(0, reviewItems.length)
      .forEach((pos, i) => reviewAt.set(pos, reviewItems[i]));
    const used = new Set(reviewItems.map(r => r.key));
    const run = [];
    const other = op => (op === 'mul' ? 'div' : 'mul');

    const draw = (op, allowBackToBack) => {
      if (!fresh[op].length) return null;
      const prevKey = run.length ? run[run.length - 1].key : null;
      let idx = bags[op].findIndex(e => !used.has(e.key) && e.key !== prevKey);
      if (idx === -1) {
        fresh[op].forEach(e => used.delete(e.key));
        bags[op] = RNG.shuffle(fresh[op]);
        idx = bags[op].findIndex(e => e.key !== prevKey);
        if (idx === -1) {
          if (!allowBackToBack) return null;
          idx = 0;
        }
      }
      const eq = bags[op].splice(idx, 1)[0];
      used.add(eq.key);
      return eq;
    };

    for (let i = 0; i < count; i++) {
      if (reviewAt.has(i)) {
        const r = reviewAt.get(i);
        run.push({ ...withBlank(make(r.op, r.a, r.b), undefined, level), isReview: true });
        continue;
      }
      let op = RNG.random() < 0.5 ? 'mul' : 'div';
      const tail = run.slice(-CONFIG.MAX_SAME_OP_IN_A_ROW);
      if (tail.length === CONFIG.MAX_SAME_OP_IN_A_ROW && tail.every(e => e.op === op)) op = other(op);
      const eq = draw(op, false) || draw(other(op), false) || draw(op, true) || draw(other(op), true);
      run.push({ ...withBlank(eq, undefined, level), isReview: false });
    }
    return run;
  }

  function weightedFact(candidates, level, weight = () => 1) {
    const families = new Map();
    candidates.forEach(eq => {
      const key = Learning.family(eq, level);
      if (!families.has(key)) families.set(key, []);
      families.get(key).push(eq);
    });
    const entries = Array.from(families.values());
    let ticket = RNG.random() * entries.reduce((sum, facts) => sum + weight(facts[0]), 0);
    for (const facts of entries) {
      ticket -= weight(facts[0]);
      if (ticket < 0) return RNG.pick(facts);
    }
    return RNG.pick(entries[entries.length - 1]);
  }

  function buildPractice(level, range) {
    const all = pool(level, range);
    const reviews = ReviewQueue.select(level);
    const exclude = ReviewQueue.keys(level);
    const used = new Set();
    // Ten questions: five of each operation, with 3/3/4 blanks across a/b/c.
    const roles = { mul: ['a', 'b', 'b', 'b', 'c'], div: ['a', 'a', 'c', 'c', 'c'] };
    if (all.some(eq => eq.op === 'div' && allowedBlanks(eq, level).includes('b'))) {
      roles.mul[3] = 'c';
      roles.div[2] = 'b';
    }
    const slots = RNG.shuffle(Object.entries(roles).flatMap(([op, blanks]) => blanks.map(blank => ({ op, blank }))));
    const supports = (eq, slot) => eq.op === slot.op && allowedBlanks(eq, level).includes(slot.blank);
    reviews.forEach(review => {
      const family = Learning.family(review, level);
      const variants = pool(level, { min: Number(family), max: Number(family) });
      let options = slots.filter(slot => !slot.eq && variants.some(eq => supports(eq, slot) && !used.has(eq.key)));
      if (!options.length) options = slots.filter(slot => !slot.eq && variants.some(eq => supports(eq, slot)));
      if (!options.length) throw new Error(`Cannot schedule review fact ${review.key} with the required practice mix`);
      const slot = RNG.pick(options);
      const available = variants.filter(eq => supports(eq, slot));
      slot.eq = RNG.pick(available.filter(eq => !used.has(eq.key)).length
        ? available.filter(eq => !used.has(eq.key)) : available);
      slot.reviewKey = review.key;
      used.add(slot.eq.key);
    });
    slots.filter(slot => !slot.eq).forEach(slot => {
      const available = all.filter(eq => supports(eq, slot));
      const fresh = available.filter(eq => !used.has(eq.key) && !exclude.has(eq.key));
      const unused = available.filter(eq => !used.has(eq.key));
      slot.eq = weightedFact(fresh.length ? fresh : unused.length ? unused : available, level,
        eq => Learning.weight(level, eq));
      used.add(slot.eq.key);
    });
    const groups = {
      mul: RNG.shuffle(slots.filter(slot => slot.op === 'mul')),
      div: RNG.shuffle(slots.filter(slot => slot.op === 'div')),
    };
    const run = [];
    while (groups.mul.length || groups.div.length) {
      let op = groups.mul.length === groups.div.length ? RNG.pick(['mul', 'div'])
        : groups.mul.length > groups.div.length ? 'mul' : 'div';
      if (run.length >= 2 && run.slice(-2).every(eq => eq.op === op)) op = op === 'mul' ? 'div' : 'mul';
      const slot = groups[op].pop();
      run.push({ ...withBlank(slot.eq, slot.blank, level), isReview: !!slot.reviewKey, reviewKey: slot.reviewKey });
    }
    return run;
  }

  function buildMaster(range, previousOp) {
    const levels = RNG.shuffle(CONFIG.LEVELS);
    let op = previousOp === 'mul' ? 'div' : 'mul';
    return levels.map(level => {
      const eq = weightedFact(pool(level, range).filter(eq => eq.op === op), level);
      op = op === 'mul' ? 'div' : 'mul';
      return { ...withBlank(eq, undefined, level), level, isReview: false };
    });
  }

  return {
    SYMBOL,
    BLANKS,
    make,
    withBlank,
    allowedBlanks,
    parts,
    puzzle,
    spoken,
    validate,
    pool,
    buildRun,
    buildPractice,
    buildMaster,
    weightedFact,
    maxDigits: range => Util.digits(9 * range.max),
    text: eq => `${eq.a} ${SYMBOL[eq.op]} ${eq.b} = ${eq.answer}`,
  };
})();

const Learning = {
  family(eq, level) {
    return String(eq.op === 'mul' ? (eq.a === level ? eq.b : eq.a)
      : eq.b === level ? eq.answer : eq.b);
  },
  sanitize(raw, run = 0) {
    return {
      streak: Util.int(raw.streak, 0, 0, CONFIG.LEARNING_STREAK),
      variants: Array.from(new Set(Array.isArray(raw.variants) ? raw.variants.filter(v => /^(mul|div):[abc]$/.test(v)) : [])),
      misses: Util.int(raw.misses, 0, 0, 1e6),
      lastRun: Util.int(raw.lastRun, 0, 0, run),
      lastSeenAt: Util.int(raw.lastSeenAt, 0, 0, 8.64e15),
    };
  },
  mastered(item) { return item.streak >= CONFIG.LEARNING_STREAK && item.variants.length >= 2; },
  weight(level, eq) {
    const item = Profile.level(level).learning[this.family(eq, level)];
    if (!item) return 1;
    if (this.mastered(item)) return 0.2;
    return (item.misses ? 2 + Math.min(item.misses, 3) : 1) / (1 + item.streak);
  },
  record(level, eq, correct, run) {
    const learning = Profile.level(level).learning;
    const key = this.family(eq, level);
    const item = learning[key] || (learning[key] = this.sanitize({}));
    item.lastSeenAt = Date.now();
    if (!correct) {
      item.streak = 0;
      item.variants = [];
      item.misses = Math.min(item.misses + 1, 1e6);
      item.lastRun = run;
    } else {
      if (item.lastRun !== run) item.streak = Math.min(item.streak + 1, CONFIG.LEARNING_STREAK);
      item.lastRun = run;
      const variant = `${eq.op}:${eq.blank}`;
      if (!item.variants.includes(variant)) item.variants.push(variant);
    }
    Profile.commit('learning');
  },
};

/* =====================================================================
   6. REVIEW QUEUE — targeted spaced repetition (per level, persistent)
   ===================================================================== */
const ReviewQueue = {
  sanitizeItem(item, level) {
    if (!item || typeof item !== 'object' || (item.op !== 'mul' && item.op !== 'div')) return null;
    const a = Util.int(item.a, NaN);
    const b = Util.int(item.b, NaN);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
    let eq = EquationFactory.make(item.op, a, b);
    // Preserve legacy division facts by swapping the divisor with the level-sized quotient.
    if (eq.op === 'div' && b > CONFIG.MAX_DIVISOR && eq.answer === level) {
      eq = EquationFactory.make('div', a, level);
    }
    if (!EquationFactory.validate(eq, level)) return null;
    return {
      key: eq.key, op: eq.op, a: eq.a, b: eq.b, answer: eq.answer,
      streak: Util.int(item.streak, 0, 0, CONFIG.REVIEW_CLEAR_STREAK - 1),
      misses: Util.int(item.misses, 1, 1, 1e6),
      addedAt: Util.int(item.addedAt, Date.now(), 0, 8.64e15),
      lastSeenAt: Util.int(item.lastSeenAt, 0, 0, 8.64e15),
    };
  },
  queue: level => Profile.level(level).reviewQueue,
  size(level) { return this.queue(level).length; },
  keys(level) { return new Set(this.queue(level).map(i => i.key)); },
  prioritized(level) {
    return this.queue(level).slice().sort((x, y) => (y.misses - x.misses) || (x.addedAt - y.addedAt));
  },
  select(level, max = CONFIG.REVIEW_SLOTS_PER_SESSION) { return this.prioritized(level).slice(0, max); },
  /* correct + countsForStreak → streak++, cleared at REVIEW_CLEAR_STREAK; wrong → logged / streak reset. */
  record(level, eq, correct, countsForStreak) {
    const q = this.queue(level);
    const idx = q.findIndex(i => i.key === (eq.reviewKey || eq.key));
    const now = Date.now();
    const result = { logged: false, cleared: false, streak: 0 };
    if (!correct) {
      if (idx >= 0) {
        q[idx].streak = 0;
        q[idx].misses += 1;
        q[idx].lastSeenAt = now;
      } else {
        q.push({ key: eq.key, op: eq.op, a: eq.a, b: eq.b, answer: eq.answer, streak: 0, misses: 1, addedAt: now, lastSeenAt: now });
        if (q.length > CONFIG.REVIEW_QUEUE_MAX) {
          let victim = 0;
          for (let i = 1; i < q.length - 1; i++) {
            if (q[i].misses < q[victim].misses || (q[i].misses === q[victim].misses && q[i].addedAt < q[victim].addedAt)) victim = i;
          }
          q.splice(victim, 1);
        }
      }
      result.logged = true;
    } else if (idx >= 0 && countsForStreak) {
      const item = q[idx];
      item.streak += 1;
      item.lastSeenAt = now;
      result.streak = item.streak;
      if (item.streak >= CONFIG.REVIEW_CLEAR_STREAK) {
        q.splice(idx, 1);
        result.cleared = true;
      }
    } else {
      return result;
    }
    Profile.commit('review');
    return result;
  },
};

/* =====================================================================
   7. TIMING — pausable delays & drift-free sprint clock
   ===================================================================== */
class Delay {
  constructor(ms, fn) {
    this.left = Math.max(0, ms);
    this.fn = fn;
    this.id = 0;
    this.startedAt = 0;
    this.done = false;
    this.resume();
  }
  resume() {
    if (this.done || this.id) return;
    this.startedAt = performance.now();
    this.id = setTimeout(() => { this.id = 0; this.done = true; this.fn(); }, this.left);
  }
  pause() {
    if (!this.id) return;
    clearTimeout(this.id);
    this.id = 0;
    this.left = Math.max(0, this.left - (performance.now() - this.startedAt));
  }
  cancel() {
    clearTimeout(this.id);
    this.id = 0;
    this.done = true;
  }
}

class SprintTimer {
  constructor(durationMs, { onTick, onExpire } = {}) {
    this.remaining = durationMs;
    this.freezeLeft = 0;
    this.consumed = 0;
    this.running = false;
    this.paused = false;
    this.expired = false;
    this.onTick = onTick;
    this.onExpire = onExpire;
    this.last = 0;
    this.raf = 0;
    this.frame = this.frame.bind(this);
  }
  start() {
    if (this.running || this.expired) return;
    this.running = true;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.frame);
  }
  frame(now) {
    if (!this.running) return;
    let dt = now - this.last;
    this.last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 1000) dt = 1000;
    if (!this.paused) this.advance(dt);
    if (this.onTick) this.onTick(this);
    if (this.remaining <= 0) { this.expire(); return; }
    this.raf = requestAnimationFrame(this.frame);
  }
  advance(dt) {
    if (this.freezeLeft > 0) {
      const frozen = Math.min(this.freezeLeft, dt);
      this.freezeLeft -= frozen;
      dt -= frozen;
    }
    if (dt > 0) {
      const tick = Math.min(this.remaining, dt);
      this.remaining -= tick;
      this.consumed += tick;
    }
  }
  pause() { this.paused = true; }
  resume() {
    if (!this.paused) return;
    this.paused = false;
    this.last = performance.now();
  }
  addTime(ms) {
    if (this.expired) return false;
    this.remaining += ms;
    return true;
  }
  freeze(ms) {
    if (this.expired || this.freezeLeft > 0) return false;
    this.freezeLeft = ms;
    return true;
  }
  get frozen() { return this.freezeLeft > 0; }
  stop() {
    this.running = false;
    cancelAnimationFrame(this.raf);
  }
  expire() {
    if (this.expired) return;
    this.expired = true;
    this.remaining = 0;
    this.stop();
    if (this.onExpire) this.onExpire();
  }
}

/* =====================================================================
   8. GAME SESSION — one practice or sprint run; pure logic, no DOM.
      Phases: idle → [countdown] → asking ⇄ feedback | prompt | reveal → finished
   ===================================================================== */
class GameSession {
  constructor({ mode, level }) {
    this.mode = mode;
    this.level = level;
    this.range = Profile.range;
    this.total = mode === 'master' ? Infinity : mode === 'practice' ? CONFIG.PRACTICE_LENGTH : CONFIG.SPRINT_LENGTH;
    this.maxDigits = EquationFactory.maxDigits(this.range);
    this.learningRun = mode === 'practice' ? Profile.beginPractice(level) : 0;
    this.queue = mode === 'master' ? EquationFactory.buildMaster(this.range)
      : mode === 'practice' ? EquationFactory.buildPractice(level, this.range)
      : EquationFactory.buildRun(level, this.total, this.range);
    this.reviewCount = this.queue.filter(e => e.isReview).length;
    this.index = 0;
    this.input = '';
    this.correct = 0;
    this.wrong = 0;
    this.points = 0;
    this.results = [];
    this.missed = [];
    this.failed = false;
    this.retrying = false;
    this.streak = 0;
    this.bestStreak = 0;
    this.phase = 'idle';
    this.paused = false;
    this.pending = null;
    this.promptDelay = null;
    this.delays = new Set();
    this.handlers = {};
    this.used = { timeWarp: 0, freezeRay: 0, secondChance: 0 };
    this.reviewCleared = 0;
    this.summary = null;
    this.timer = mode === 'sprint'
      ? new SprintTimer(CONFIG.SPRINT_DURATION_MS, { onTick: t => this.emit('tick', t), onExpire: () => this.finish('timeout') })
      : null;
  }

  on(evt, fn) {
    if (!this.handlers[evt]) this.handlers[evt] = [];
    this.handlers[evt].push(fn);
    return this;
  }
  emit(evt, data) {
    (this.handlers[evt] || []).forEach(fn => {
      try { fn(data, this); } catch (err) { console.error('[MathSprints] session', evt, err); }
    });
  }
  get current() { return this.queue[this.isMaster ? this.index % CONFIG.LEVELS.length : this.index] || null; }
  get isSprint() { return this.mode === 'sprint'; }
  get isMaster() { return this.mode === 'master'; }
  get finished() { return this.phase === 'finished'; }

  after(ms, fn) {
    const d = new Delay(ms, () => {
      this.delays.delete(d);
      if (this.phase !== 'finished') fn();
    });
    this.delays.add(d);
    if (this.paused) d.pause();
    return d;
  }
  cancelDelay(d) {
    if (!d) return;
    d.cancel();
    this.delays.delete(d);
  }
  setPhase(p) {
    this.phase = p;
    this.emit('phase', p);
  }

  start() {
    if (this.phase !== 'idle') return;
    if (this.isSprint) {
      this.setPhase('countdown');
      const steps = ['3', '2', '1', 'GO!'];
      const step = i => {
        this.emit('countdown', { label: steps[i], final: i === steps.length - 1 });
        if (i < steps.length - 1) this.after(CONFIG.COUNTDOWN_STEP_MS, () => step(i + 1));
        else this.after(Math.round(CONFIG.COUNTDOWN_STEP_MS * 0.6), () => { this.timer.start(); this.ask(); });
      };
      step(0);
    } else {
      this.ask();
    }
  }

  ask() {
    this.input = '';
    this.retrying = false;
    this.setPhase('asking');
    this.emit('question', { eq: this.current, index: this.index });
  }

  press(key) {
    if (this.phase !== 'asking' || this.paused) return { ok: false, reason: 'locked' };
    if (key === 'ok') return this.submit();
    if (key === 'del') {
      if (!this.input) return { ok: false, reason: 'empty' };
      this.input = this.input.slice(0, -1);
      this.emit('input', this.input);
      return { ok: true };
    }
    if (key === 'clear') {
      if (!this.input) return { ok: false, reason: 'empty' };
      this.input = '';
      this.emit('input', this.input);
      return { ok: true };
    }
    if (!/^[0-9]$/.test(key)) return { ok: false, reason: 'invalid' };
    if (this.input === '' && key === '0') return { ok: false, reason: 'leading-zero' };
    if (this.input.length >= this.maxDigits) return { ok: false, reason: 'max' };
    this.input += key;
    this.emit('input', this.input);
    const eq = this.current;
    if (eq && this.input.length >= Util.digits(eq.target)) {
      const res = this.submit();
      return { ...res, ok: true, submitted: true };
    }
    return { ok: true };
  }

  submit() {
    if (this.phase !== 'asking' || this.paused) return { ok: false, reason: 'locked' };
    if (!this.input) return { ok: false, reason: 'empty' };
    const eq = this.current;
    const given = parseInt(this.input, 10);
    if (given === eq.target) this.onCorrect(eq, given);
    else this.onWrong(eq, given);
    return { ok: true, correct: given === eq.target };
  }

  onCorrect(eq, given) {
    this.correct += 1;
    this.streak += 1;
    this.bestStreak = Math.max(this.bestStreak, this.streak);
    if (!this.isMaster) {
      this.points += CONFIG.POINTS_PER_CORRECT;
      this.results[this.index] = 'ok';
      Profile.earn(CONFIG.POINTS_PER_CORRECT);
    }
    // The last answer completes the sprint; feedback animation must not consume its spare time.
    if (this.isSprint && this.index === this.total - 1 && this.timer.remaining > 0) this.timer.stop();
    let review = null;
    if (this.mode === 'practice') {
      if (!this.retrying) Learning.record(this.level, eq, true, this.learningRun);
      review = ReviewQueue.record(this.level, eq, true, eq.isReview && !this.retrying);
      if (review.cleared) this.reviewCleared += 1;
    }
    this.setPhase('feedback');
    this.emit('correct', { eq, given, streak: this.streak, review, retried: this.retrying });
    this.after(CONFIG.FEEDBACK_MS[this.isMaster ? 'practice' : this.mode], () => this.advance());
  }

  onWrong(eq, given) {
    this.streak = 0;
    if (this.mode === 'practice') {
      Learning.record(this.level, eq, false, this.learningRun);
      ReviewQueue.record(this.level, eq, false, false);
    }
    const canRedo = !this.isMaster && Profile.count('secondChance') > 0 && (this.isSprint || !this.failed);
    if (canRedo) {
      this.pending = { eq, given };
      this.setPhase('prompt');
      this.emit('wrong', { eq, given, prompt: true });
      this.emit('prompt', { eq, given, charges: Profile.count('secondChance'), timed: this.isSprint, windowMs: CONFIG.SPRINT_REDO_WINDOW_MS });
      if (this.isSprint) this.promptDelay = this.after(CONFIG.SPRINT_REDO_WINDOW_MS, () => this.declineSecondChance());
    } else {
      this.emit('wrong', { eq, given, prompt: false });
      this.commitMistake(eq, given);
    }
  }

  useSecondChance() {
    if (this.phase !== 'prompt' || this.paused || !this.pending) return false;
    if (!Profile.consume('secondChance')) { this.declineSecondChance(); return false; }
    this.cancelDelay(this.promptDelay);
    this.promptDelay = null;
    this.used.secondChance += 1;
    this.pending = null;
    this.retrying = true;
    this.input = '';
    this.setPhase('asking');
    this.emit('retry', { eq: this.current, charges: Profile.count('secondChance') });
    return true;
  }

  declineSecondChance() {
    if (this.phase !== 'prompt' || !this.pending) return false;
    this.cancelDelay(this.promptDelay);
    this.promptDelay = null;
    const { eq, given } = this.pending;
    this.pending = null;
    this.commitMistake(eq, given);
    return true;
  }

  commitMistake(eq, given) {
    this.wrong += 1;
    if (!this.isMaster) this.results[this.index] = 'bad';
    if (!this.missed.some(m => m.eq.key === eq.key)) this.missed.push({ eq, given });
    let justFailed = false;
    if (this.mode === 'practice' && !this.failed) { this.failed = true; justFailed = true; }
    this.setPhase('reveal');
    this.emit('reveal', { eq, given, justFailed });
    if (this.isMaster) this.finish('mistake');
    else if (this.isSprint) this.advance();
    else this.after(CONFIG.PRACTICE_REVEAL_MS, () => this.advance());
  }

  advance() {
    if (this.phase === 'finished') return;
    this.index += 1;
    if (this.isMaster && this.index % CONFIG.LEVELS.length === 0) {
      this.queue = EquationFactory.buildMaster(this.range, this.queue[this.queue.length - 1].op);
    }
    if (this.index >= this.total) { this.finish('complete'); return; }
    this.ask();
  }

  canUse(id) {
    const p = POWERUP_BY_ID.get(id);
    if (!p) return { ok: false, reason: 'unknown' };
    if (!p.modes.includes(this.mode)) return { ok: false, reason: 'mode' };
    if (this.phase === 'finished') return { ok: false, reason: 'not-now' };
    if (Profile.count(id) <= 0) return { ok: false, reason: 'none' };
    if (id === 'secondChance') return this.phase === 'prompt' && !this.paused ? { ok: true } : { ok: false, reason: 'auto' };
    if (this.paused || !['asking', 'feedback', 'prompt', 'reveal'].includes(this.phase)) return { ok: false, reason: 'not-now' };
    if (id === 'timeWarp' && this.used.timeWarp >= CONFIG.TIME_WARP_MAX_PER_RUN) return { ok: false, reason: 'limit' };
    if (id === 'freezeRay' && this.timer && this.timer.frozen) return { ok: false, reason: 'active' };
    return { ok: true };
  }

  usePowerup(id) {
    const check = this.canUse(id);
    if (!check.ok) return check;
    if (id === 'secondChance') return { ok: this.useSecondChance() };
    if (!Profile.consume(id)) return { ok: false, reason: 'none' };
    this.used[id] += 1;
    if (id === 'timeWarp') {
      this.timer.addTime(CONFIG.TIME_WARP_MS);
      this.emit('warp', { used: this.used.timeWarp });
    } else if (id === 'freezeRay') {
      this.timer.freeze(CONFIG.FREEZE_MS);
      this.emit('freeze', { ms: CONFIG.FREEZE_MS });
    }
    return { ok: true };
  }

  pause(reason = 'user') {
    if (this.paused || this.phase === 'finished' || this.phase === 'idle') return false;
    this.paused = true;
    this.delays.forEach(d => d.pause());
    if (this.timer && this.timer.running) this.timer.pause();
    this.emit('pause', { reason });
    return true;
  }

  resume() {
    if (!this.paused || this.phase === 'finished') return false;
    this.paused = false;
    this.delays.forEach(d => d.resume());
    if (this.timer && this.timer.running) this.timer.resume();
    this.emit('resume', {});
    return true;
  }

  finish(reason) {
    if (this.phase === 'finished') return;
    if (this.phase === 'prompt' && this.pending) {
      // Time ran out inside the redo window: the miss stands.
      this.wrong += 1;
      this.results[this.index] = 'bad';
      if (!this.missed.some(m => m.eq.key === this.pending.eq.key)) this.missed.push(this.pending);
      this.pending = null;
    }
    this.phase = 'finished';
    this.paused = false;
    this.delays.forEach(d => d.cancel());
    this.delays.clear();
    if (this.timer) this.timer.stop();
    const summary = {
      mode: this.mode, level: this.level, reason,
      correct: this.correct, wrong: this.wrong, total: this.total,
      answered: Math.min(this.total, this.correct + this.wrong),
      points: this.points, missed: this.missed.slice(), bestStreak: this.bestStreak,
      used: { ...this.used }, reviewCount: this.reviewCount, reviewCleared: this.reviewCleared,
    };
    if (this.isMaster) {
      summary.record = Profile.recordMaster(this.bestStreak, this.range);
    } else if (this.isSprint) {
      const finishedAll = reason === 'complete';
      const record = Profile.recordSprint(this.level, {
        score: this.correct, timeMs: this.timer.consumed, finishedAll,
        noPowerups: Object.values(this.used).every(count => count === 0),
        timeLeftMs: this.timer.remaining,
      });
      summary.points += record.bonus;
      Object.assign(summary, { finishedAll, timeUsedMs: this.timer.consumed, timeLeftMs: this.timer.remaining, record });
    } else {
      const perfect = reason === 'complete' && !this.failed && this.correct === this.total;
      const record = Profile.recordPractice(this.level, perfect);
      Object.assign(summary, { perfect, failed: this.failed, record, reviewLeft: ReviewQueue.size(this.level) });
    }
    this.summary = summary;
    this.emit('phase', 'finished');
    this.emit('finish', summary);
  }

  /* Leave mid-run: earned stars stay, the run is not recorded. */
  abandon() {
    if (this.phase === 'finished') return;
    this.phase = 'finished';
    this.delays.forEach(d => d.cancel());
    this.delays.clear();
    if (this.timer) this.timer.stop();
    this.handlers = {};
  }
}

/* =====================================================================
   9. AUDIO ENGINE — everything synthesized with the Web Audio API
   ===================================================================== */
const AudioEngine = (() => {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;
  let master = null;
  let sfxBus = null;
  let musicBus = null;
  let noiseBuffer = null;
  let sfxOn = true;
  let musicOn = false;
  let music = null;

  function ensure() {
    if (!Ctx) return null;
    if (!ctx) {
      try {
        ctx = new Ctx();
        master = ctx.createGain();
        master.gain.value = 0.9;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
        master.connect(comp);
        comp.connect(ctx.destination);
        sfxBus = ctx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
        musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
        noiseBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      } catch (err) {
        ctx = null;
        return null;
      }
    }
    if (ctx.state === 'suspended' && !document.hidden) {
      try { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ }
    }
    return ctx;
  }

  function envelope(param, t0, peak, attack, dur) {
    param.setValueAtTime(0.0001, t0);
    param.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    param.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }

  function voice({ type = 'sine', freq = 440, to = null, at = 0, dur = 0.2, peak = 0.2, attack = 0.008, filter = null }) {
    const c = ensure();
    if (!c || !sfxOn) return;
    const t0 = c.currentTime + at;
    const osc = c.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const gain = c.createGain();
    envelope(gain.gain, t0, peak, attack, dur);
    let node = osc;
    if (filter) {
      const f = c.createBiquadFilter();
      f.type = filter.type || 'lowpass';
      f.frequency.value = filter.freq;
      f.Q.value = filter.q || 0.7;
      osc.connect(f);
      node = f;
    }
    node.connect(gain);
    gain.connect(sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function noise({ at = 0, dur = 0.03, peak = 0.1, type = 'bandpass', freq = 2400, to = null, q = 1.2 }) {
    const c = ensure();
    if (!c || !sfxOn) return;
    const t0 = c.currentTime + at;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer;
    const f = c.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t0);
    f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const gain = c.createGain();
    envelope(gain.gain, t0, peak, 0.004, dur);
    src.connect(f);
    f.connect(gain);
    gain.connect(sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  const sounds = {
    /* Cheerful ascending dual-tone chime: 440 Hz → 880 Hz sine. */
    correct() {
      const c = ensure();
      if (!c) return;
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t0);
      osc.frequency.setValueAtTime(880, t0 + 0.09);
      const gain = c.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.26, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.1, t0 + 0.085);
      gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.48);
      osc.connect(gain);
      gain.connect(sfxBus);
      osc.start(t0);
      osc.stop(t0 + 0.52);
      voice({ freq: 1760, at: 0.09, dur: 0.32, peak: 0.045 });
    },
    /* Brief descending buzz: 180 Hz → 100 Hz sawtooth, softened by a low-pass filter. */
    wrong() { voice({ type: 'sawtooth', freq: 180, to: 100, dur: 0.32, peak: 0.12, attack: 0.01, filter: { type: 'lowpass', freq: 900 } }); },
    /* Ultra-short neutral click. */
    tap() { noise({ dur: 0.025, peak: 0.09, freq: 2600 }); },
    tick() { voice({ type: 'triangle', freq: 1150, dur: 0.06, peak: 0.08, attack: 0.003 }); },
    coin() {
      voice({ type: 'square', freq: 988, dur: 0.09, peak: 0.05, filter: { freq: 3200 } });
      voice({ type: 'square', freq: 1319, at: 0.08, dur: 0.32, peak: 0.05, filter: { freq: 3200 } });
    },
    fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => voice({ type: 'triangle', freq: f, at: i * 0.1, dur: i === 3 ? 0.6 : 0.18, peak: 0.16 }));
      voice({ freq: 2093, at: 0.3, dur: 0.5, peak: 0.04 });
    },
    unlock() {
      [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => voice({ type: 'triangle', freq: f, at: i * 0.08, dur: i === 5 ? 0.8 : 0.16, peak: 0.15 }));
    },
    warp() {
      voice({ type: 'sine', freq: 300, to: 1400, dur: 0.45, peak: 0.16 });
      noise({ dur: 0.4, peak: 0.05, freq: 500, to: 4000 });
    },
    freeze() { [2093, 1760, 1568, 1319, 1047].forEach((f, i) => voice({ freq: f, at: i * 0.06, dur: 0.3, peak: 0.06 })); },
    whoosh() { noise({ dur: 0.35, peak: 0.08, freq: 400, to: 3000, q: 0.8 }); },
    count(final) { voice({ type: 'triangle', freq: final ? 880 : 523.25, dur: final ? 0.4 : 0.14, peak: 0.16 }); },
    nope() { voice({ type: 'triangle', freq: 220, dur: 0.08, peak: 0.07 }); },
  };

  /* Ambient Focus Track: low-pass-filtered triangle pad gliding through
     Cmaj7 → Am7 → Fmaj7 → G6 with a slow filter sweep, a soft pulse and rare twinkles. */
  const CHORDS = [
    [130.81, 164.81, 196.0, 246.94],
    [110.0, 130.81, 164.81, 196.0],
    [87.31, 110.0, 130.81, 164.81],
    [98.0, 123.47, 146.83, 164.81],
  ];
  const TWINKLES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  function twinkle(at) {
    if (!ctx || !music) return;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = TWINKLES[Math.floor(Math.random() * TWINKLES.length)];
    const gain = ctx.createGain();
    envelope(gain.gain, at, 0.05, 0.03, 1.8);
    osc.connect(gain);
    gain.connect(musicBus);
    osc.start(at);
    osc.stop(at + 1.9);
  }

  function startMusic() {
    const c = ensure();
    if (!c || music) return;
    const t = c.currentTime;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 720; filter.Q.value = 0.8;
    const sweep = c.createOscillator(); sweep.frequency.value = 0.07;
    const sweepDepth = c.createGain(); sweepDepth.gain.value = 260;
    sweep.connect(sweepDepth); sweepDepth.connect(filter.frequency);
    const pulse = c.createGain(); pulse.gain.value = 0.72;
    const pulseLfo = c.createOscillator(); pulseLfo.frequency.value = 0.2;
    const pulseDepth = c.createGain(); pulseDepth.gain.value = 0.22;
    pulseLfo.connect(pulseDepth); pulseDepth.connect(pulse.gain);
    filter.connect(pulse); pulse.connect(musicBus);
    const voices = CHORDS[0].map((f, i) => {
      const osc = c.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (i - 1.5) * 5;
      const g = c.createGain(); g.gain.value = 0.16;
      osc.connect(g); g.connect(filter);
      osc.start(t);
      return osc;
    });
    const sub = c.createOscillator(); sub.type = 'sine'; sub.frequency.value = CHORDS[0][0] / 2;
    const subGain = c.createGain(); subGain.gain.value = 0.2;
    sub.connect(subGain); subGain.connect(filter);
    sub.start(t); sweep.start(t); pulseLfo.start(t);
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value, t);
    musicBus.gain.linearRampToValueAtTime(0.14, t + 1.5);
    let chord = 0;
    const interval = setInterval(() => {
      if (!music || !ctx) return;
      chord = (chord + 1) % CHORDS.length;
      const now = ctx.currentTime;
      CHORDS[chord].forEach((f, i) => voices[i].frequency.setTargetAtTime(f, now, 1.1));
      sub.frequency.setTargetAtTime(CHORDS[chord][0] / 2, now, 1.1);
      if (Math.random() < 0.65) twinkle(now + 0.8 + Math.random() * 5);
    }, 8000);
    music = { voices, sub, sweep, pulseLfo, filter, pulse, interval };
  }

  function stopMusic() {
    if (!music) return;
    const m = music;
    music = null;
    clearInterval(m.interval);
    if (!ctx) return;
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(musicBus.gain.value, t);
    musicBus.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => {
      [...m.voices, m.sub, m.sweep, m.pulseLfo].forEach(o => { try { o.stop(); } catch (err) { /* already stopped */ } });
      try { m.filter.disconnect(); m.pulse.disconnect(); } catch (err) { /* ignore */ }
    }, 1400);
  }

  return {
    get supported() { return !!Ctx; },
    get musicPlaying() { return !!music; },
    unlock() {
      const c = ensure();
      if (c && musicOn && !music) startMusic();
    },
    setSfx(on) { sfxOn = !!on; },
    setMusic(on) {
      musicOn = !!on;
      if (musicOn) { if (ctx) startMusic(); } else stopMusic();
    },
    play(name, arg) {
      if (!sfxOn) return;
      try { if (sounds[name]) sounds[name](arg); } catch (err) { /* sound must never break the game */ }
    },
    onVisibility(hidden) {
      if (!ctx) return;
      try {
        const p = hidden ? ctx.suspend() : ctx.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (err) { /* ignore */ }
    },
  };
})();

/* =====================================================================
   10. FX — confetti canvas, floating "+1 ⭐", shakes, haptics
   ===================================================================== */
const FX = (() => {
  const canvas = document.getElementById('fx');
  const g = canvas.getContext('2d');
  let parts = [];
  let raf = 0;
  let dpr = 1;

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }
  function palette() {
    const v = getComputedStyle(document.body).getPropertyValue('--confetti').trim();
    return v ? v.split(',').map(s => s.trim()) : ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7'];
  }
  function star(r) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.45 : r;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    g.closePath();
    g.fill();
  }
  function loop() {
    const now = performance.now();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, window.innerWidth, window.innerHeight);
    parts = parts.filter(p => now - p.born < p.life && p.y < window.innerHeight + 60);
    for (const p of parts) {
      const t = Math.min(4, (now - p.last) / 16.67);
      p.last = now;
      p.vy += p.gravity * t;
      p.vx *= Math.pow(p.drag, t);
      p.vy *= Math.pow(p.drag, t);
      p.x += p.vx * t;
      p.y += p.vy * t;
      p.rot += p.spin * t;
      const age = (now - p.born) / p.life;
      g.save();
      g.globalAlpha = age > 0.75 ? Math.max(0, (1 - age) / 0.25) : 1;
      g.translate(p.x, p.y);
      g.rotate(p.rot);
      g.fillStyle = p.color;
      if (p.shape === 'star') star(p.size * 0.6);
      else g.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      g.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = 0; g.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  function spawn(list) {
    if (Util.reducedMotion() || document.hidden) return;
    parts.push(...list);
    if (parts.length > 420) parts.splice(0, parts.length - 420);
    if (!raf) { resize(); raf = requestAnimationFrame(loop); }
  }

  return {
    resize,
    confetti(count = 130) {
      const colors = palette();
      const now = performance.now();
      const list = [];
      for (let i = 0; i < count; i++) {
        const left = i % 2 === 0;
        list.push({
          x: left ? -10 : window.innerWidth + 10,
          y: window.innerHeight * (0.55 + Math.random() * 0.3),
          vx: (left ? 1 : -1) * (5 + Math.random() * 9),
          vy: -(10 + Math.random() * 12),
          gravity: 0.36, drag: 0.985, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.4,
          size: 8 + Math.random() * 8, color: colors[i % colors.length], shape: Math.random() < 0.25 ? 'star' : 'rect',
          born: now, last: now, life: 2600 + Math.random() * 1200,
        });
      }
      spawn(list);
    },
    burst(x, y, count = 14) {
      const colors = palette();
      const now = performance.now();
      const list = [];
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = 3 + Math.random() * 4;
        list.push({
          x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 1.5, gravity: 0.12, drag: 0.94,
          rot: 0, spin: (Math.random() - 0.5) * 0.3, size: 9 + Math.random() * 6, color: colors[i % colors.length],
          shape: 'star', born: now, last: now, life: 650 + Math.random() * 300,
        });
      }
      spawn(list);
    },
    burstFrom(el, count) {
      if (!el) return;
      const r = el.getBoundingClientRect();
      FX.burst(r.left + r.width / 2, r.top + r.height / 2, count);
    },
    floatText(text, fromEl, toEl) {
      if (!fromEl || document.hidden) return;
      const a = fromEl.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'floater';
      el.textContent = text;
      el.setAttribute('aria-hidden', 'true');
      const x0 = a.left + a.width / 2;
      const y0 = a.top;
      el.style.left = `${x0}px`;
      el.style.top = `${y0}px`;
      document.body.appendChild(el);
      let dx = 0;
      let dy = -70;
      if (toEl) {
        const b = toEl.getBoundingClientRect();
        if (b.width) { dx = b.left + b.width / 2 - x0; dy = b.top + b.height / 2 - y0; }
      }
      if (Util.reducedMotion() || !el.animate) { setTimeout(() => el.remove(), 500); return; }
      const anim = el.animate([
        { transform: 'translate(-50%, -50%) scale(.6)', opacity: 0 },
        { transform: 'translate(-50%, -120%) scale(1.25)', opacity: 1, offset: 0.3 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.7)`, opacity: 0.85 },
      ], { duration: 820, easing: 'cubic-bezier(.5,0,.3,1)' });
      anim.onfinish = () => el.remove();
      anim.oncancel = () => el.remove();
    },
    shake(el) {
      if (!el) return;
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    },
    vibrate(pattern) {
      if (!Profile.state.settings.haptics || !navigator.vibrate) return;
      try { navigator.vibrate(pattern); } catch (err) { /* unsupported */ }
    },
  };
})();

/* =====================================================================
   11. UI KIT — sheets/dialogs, toasts, announcer, Back-button guard
   ===================================================================== */
const UI = (() => {
  const modalRoot = document.getElementById('modal-root');
  const toastRoot = document.getElementById('toasts');
  const announcer = document.getElementById('announcer');
  const stack = [];

  function close(entry, result) {
    if (entry.closed) return;
    entry.closed = true;
    const i = stack.indexOf(entry);
    if (i >= 0) stack.splice(i, 1);
    entry.overlay.classList.add('closing');
    setTimeout(() => entry.overlay.remove(), Util.reducedMotion() ? 0 : 180);
    if (entry.onClose) entry.onClose(result);
    const back = entry.prevFocus;
    if (back && typeof back.focus === 'function' && document.contains(back)) {
      try { back.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
    }
  }

  function open({ html, className = '', center = false, opaque = false, dismissible = true, label = 'Dialog', onClose = null, onMount = null }) {
    const overlay = document.createElement('div');
    overlay.className = `overlay${center ? ' center' : ''}${opaque ? ' opaque' : ''}`;
    overlay.innerHTML = `<section class="sheet panel ${className}" role="dialog" aria-modal="true" aria-label="${Util.esc(label)}" tabindex="-1">${html}</section>`;
    const sheet = overlay.firstElementChild;
    const entry = { overlay, sheet, dismissible, onClose, prevFocus: document.activeElement, closed: false };
    entry.close = result => close(entry, result);
    overlay.addEventListener('click', e => { if (e.target === overlay && entry.dismissible) entry.close(); });
    modalRoot.appendChild(overlay);
    stack.push(entry);
    Nav.arm();
    if (onMount) onMount(sheet, entry);
    requestAnimationFrame(() => {
      if (entry.closed) return;
      const target = sheet.querySelector('[data-autofocus]') || sheet;
      try { target.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
    });
    return entry;
  }

  function confirm({ title, message = '', yes = 'Yes', no = 'No', icon = '❓', danger = false }) {
    return new Promise(resolve => {
      const entry = open({
        center: true,
        label: title,
        html: `<div class="dlg"><div class="dlg-icon" aria-hidden="true">${icon}</div><h2 class="display">${Util.esc(title)}</h2>${message ? `<p>${message}</p>` : ''}
          <div class="dlg-actions"><button class="btn ${danger ? 'btn-danger' : 'btn-good'}" data-r="yes" data-autofocus>${Util.esc(yes)}</button><button class="btn btn-ghost" data-r="no">${Util.esc(no)}</button></div></div>`,
        onClose: r => resolve(r === true),
      });
      entry.sheet.addEventListener('click', e => {
        const b = e.target.closest('[data-r]');
        if (!b) return;
        AudioEngine.play('tap');
        entry.close(b.dataset.r === 'yes');
      });
    });
  }

  function toast(html, { kind = '', ms = 2200 } = {}) {
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.innerHTML = html;
    toastRoot.appendChild(el);
    while (toastRoot.children.length > 3) toastRoot.firstElementChild.remove();
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 260);
    }, ms);
  }

  function announce(text) {
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = text; }, 40);
  }

  return {
    open, confirm, toast, announce,
    top: () => stack[stack.length - 1] || null,
    get count() { return stack.length; },
    closeAll() { stack.slice().reverse().forEach(e => e.close()); },
    clearToasts() { toastRoot.innerHTML = ''; },
  };
})();

/* Keeps one history entry above the app so the Android/browser Back button
   closes sheets, leaves screens or asks before quitting a run. */
const Nav = (() => {
  let armed = false;
  return {
    init() {
      try { history.replaceState({ mathSprints: 'root' }, ''); } catch (err) { /* file:// quirks */ }
      window.addEventListener('popstate', e => {
        if (e.state && e.state.mathSprints === 'guard') { armed = true; return; }
        armed = false;
        if (App.handleBack()) Nav.arm();
      });
    },
    arm() {
      if (armed) return;
      try { history.pushState({ mathSprints: 'guard' }, ''); armed = true; } catch (err) { armed = false; }
    },
  };
})();

/* Keeps every wallet chip in sync and makes it bounce when stars arrive. */
const Wallet = {
  shown: null,
  html(sm = false) {
    const pts = Profile.points;
    return `<${sm ? 'div' : 'button'} class="wallet${sm ? ' sm' : ''}" ${sm ? '' : 'data-action="shop"'} aria-label="${pts} stars${sm ? '' : ', open the shop'}"><span class="star-ico" aria-hidden="true">⭐</span><b data-wallet>${pts}</b></${sm ? 'div' : 'button'}>`;

      el.textContent = String(pts);

};

   12. SCREENS — Hub, Level sheet, Shop, Grown-ups settings

const Screens = {};

function pipsHTML(done) {

/* Press-and-hold gate (kid-proofing for the Grown-ups panel). */
function bindHold(btn, ms, onDone) {
  if (!btn) return;
  let timer = 0;
  const cancel = () => {
    if (timer) { clearTimeout(timer); timer = 0; }
    btn.classList.remove('holding');
  };
  const start = e => {
    if (e.type === 'keydown' && (e.repeat || (e.key !== 'Enter' && e.key !== ' '))) return;
    if (e.type === 'pointerdown' && e.button !== 0) return;
    e.preventDefault();
    cancel();
    btn.classList.add('holding');
    timer = setTimeout(() => {
      timer = 0;
      btn.classList.remove('holding');
      btn.dataset.fired = '1';
      AudioEngine.play('unlock');
      onDone();
    }, ms);
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('keydown', start);
  ['pointerup', 'pointerleave', 'pointercancel', 'keyup', 'blur'].forEach(ev => btn.addEventListener(ev, cancel));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('click', () => {
    if (btn.dataset.fired) { delete btn.dataset.fired; return; }
    UI.toast('Grown-ups: press and hold ⚙️ for 2 seconds');
  });
}

function levelCardHTML(n) {
  const L = Profile.level(n);
  const done = Math.min(L.perfectPractices, CONFIG.PERFECT_RUNS_TO_UNLOCK);
  const unlocked = Profile.isSprintUnlocked(n);
  const rq = L.reviewQueue.length;
  const mastered = L.sprintPerfects > 0;
  let sprint;
  if (!unlocked) sprint = '<span class="lc-sprint locked">🔒 Sprint</span>';
  else if (L.sprintRuns === 0) sprint = '<span class="lc-sprint ready">🏁 Sprint!</span>';
  else sprint = `<span class="lc-sprint best">🏆 ${L.sprintBest}/${CONFIG.SPRINT_LENGTH}</span><span class="lc-runs">${Util.plural(L.sprintRuns, 'run', 'runs')}</span>`;
  const label = `Level ${n}.${L.perfect ? ' Perfect.' : ''} Practice: ${unlocked ? 'complete' : `${done} of ${CONFIG.PERFECT_RUNS_TO_UNLOCK} perfect runs`}. Final Sprint ${unlocked ? (L.sprintRuns ? `best score ${L.sprintBest} of ${CONFIG.SPRINT_LENGTH}, ${Util.plural(L.sprintRuns, 'run', 'runs')}` : 'unlocked') : 'locked'}.${rq ? ` ${Util.plural(rq, 'rematch', 'rematches')} waiting.` : ''}`;
  return `<li><button class="level-card panel${mastered ? ' mastered' : ''}" data-level="${n}" aria-label="${Util.esc(label)}">
    ${mastered ? '<span class="lc-crown" aria-hidden="true">👑</span>' : ''}
    ${rq ? `<span class="lc-review" aria-hidden="true">🔁${rq}</span>` : ''}
    <span class="lc-num display" aria-hidden="true">×${n}</span>
    <span class="pips lc-pips" aria-hidden="true">${pipsHTML(done)}</span>
    <span class="lc-label" aria-hidden="true">Practice:</span>
    <span class="lc-value" aria-hidden="true">${unlocked ? 'Complete ✅' : `${done}/${CONFIG.PERFECT_RUNS_TO_UNLOCK}`}</span>
    ${L.perfect ? '<span class="badge ready" data-perfect-badge>Perfect</span>' : ''}
    <span class="lc-foot" aria-hidden="true">${sprint}</span>
  </button></li>`;
}

function openLevelSheet(n) {
  const L = Profile.level(n);
  const unlocked = Profile.isSprintUnlocked(n);
  const done = Math.min(L.perfectPractices, CONFIG.PERFECT_RUNS_TO_UNLOCK);
  const need = CONFIG.PERFECT_RUNS_TO_UNLOCK - done;
  const rq = L.reviewQueue.length;
  const needText = `${need} more perfect practice${need === 1 ? '' : 's'}`;
  const html = `<div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <span class="sheet-badge display" aria-hidden="true">×${n}<br>÷${n}</span>
      <div><h2 class="display">Level ${n}</h2><p class="sheet-sub">Multiply and divide with ${n}</p></div>
    </div>
    <ul class="sheet-stats">
      ${L.perfect ? '<li><span class="badge ready" data-perfect-badge>Perfect</span><b>40/40 without power-ups</b></li>' : ''}
      <li><span>Fact families learned</span><b>${Object.values(L.learning).filter(item => Learning.mastered(item)).length}</b></li>
      <li><span>Perfect practices</span><b><span class="pips" aria-hidden="true">${pipsHTML(done)}</span> ${unlocked ? 'Complete ✅' : `${done}/${CONFIG.PERFECT_RUNS_TO_UNLOCK}`}</b></li>
      ${rq ? `<li><span>🔁 Rematches waiting</span><b>${rq}</b></li>` : ''}
      ${L.sprintRuns ? `<li><span>🏆 Best sprint</span><b>${L.sprintBest}/${CONFIG.SPRINT_LENGTH} · ${Util.plural(L.sprintRuns, 'run', 'runs')}</b></li>` : ''}
      ${L.sprintPerfects ? `<li><span>👑 40/40 sprints</span><b>${L.sprintPerfects}${L.sprintBestTimeMs !== null ? ` · fastest ${Util.fmtSecs(L.sprintBestTimeMs)}` : ''}</b></li>` : ''}
    </ul>
    <div class="sheet-actions">
      <button class="btn btn-big btn-good" data-go="practice" data-autofocus>▶ Practice<small>${CONFIG.PRACTICE_LENGTH} questions · no timer · aim for 10/10</small></button>
      <button class="btn btn-big" data-go="sprint"${unlocked ? '' : ' aria-disabled="true"'}>${unlocked ? '⚡ Final Sprint' : '🔒 Final Sprint'}<small>${unlocked ? `${CONFIG.SPRINT_LENGTH} questions · ${Util.fmtTime(CONFIG.SPRINT_DURATION_MS)} on the clock` : `${needText} to unlock`}</small></button>
    </div>
    <button class="btn btn-ghost sheet-close" data-go="close">Close</button>`;
  const entry = UI.open({ html, label: `Level ${n}`, className: 'level-sheet' });
  entry.sheet.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    const go = b.dataset.go;
    if (go === 'close') { AudioEngine.play('tap'); entry.close(); return; }
    if (go === 'sprint' && !unlocked) {
      AudioEngine.play('nope');
      FX.shake(b);
      UI.toast(`🔒 Score 10/10 in ${needText} to unlock the Final Sprint!`);
      return;
    }
    AudioEngine.play('tap');
    entry.close();
    App.go('play', { mode: go, level: n });
  });
}
